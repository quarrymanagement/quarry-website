

# ============================================================================
# Headers — Apple App Site Association must be served as application/json
# for iOS Universal Links + App Clips to validate.
# ============================================================================
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
# ============================================================================
# Netlify config — schedules only.
# Build command auto-detected (build.sh runs by Netlify convention).
# Functions live at netlify/functions, deps in root package.json.
# ============================================================================

[build]
  command = "bash build.sh"
  publish = "."
  # Skip the build entirely when only data JSON files changed (these are
  # read directly from raw.githubusercontent.com — no rebuild needed).
  # See build-ignore.sh for the logic. Was burning ~1500 build minutes/month
  # before this; now should be well under 100.
  ignore = "bash build-ignore.sh"

[functions]
  directory = "netlify/functions"

# ----------------------------------------------------------------------------
# Scheduled functions (cron syntax = UTC)
# CDT = UTC-5, CST = UTC-6 — pick a UTC time that's reasonable in both.
# ----------------------------------------------------------------------------

# Daily marketing draft generator — DISABLED 2026-08-05 at the owner's request.
# It had produced 47 drafts for events that had already passed; none were ever
# approved, and they sat one click away from being emailed to the whole list.
# Re-enable by uncommenting the two lines below.
# [functions."marketing-generate-daily"]
#   schedule = "0 12 * * *"

# Send-queue poller — every 10 min. Drains 'approved' drafts at scheduledFor.
[functions."marketing-send"]
  schedule = "*/10 * * * *"

# Nightly AI optimizer — 7:00 UTC = 2am CDT / 1am CST. Quiet time.
[functions."marketing-optimize"]
  schedule = "0 7 * * *"

# Stats poller — once daily at 16:00 UTC = 11 AM CDT / 10 AM CST.
# Used to be every 15 min (96/day) — way more than needed for our send
# volume. Manual "Refresh now" button on the Performance tab handles
# fresher reads when actually wanted.
[functions."marketing-poll-stats"]
  schedule = "0 16 * * *"

# ─── SOCIAL ──────────────────────────────────────────────────────────────────
# Daily social drafts generator — 13:00 UTC = 8am CDT / 7am CST.
# DISABLED 2026-08-05 at the owner's request - was generating drafts nobody approved.
# Re-enable by uncommenting the two lines below.
# [functions."social-generate-daily"]
#   schedule = "0 13 * * *"

# Social send-queue poller — every 10 min. Drains 'approved' drafts at scheduledFor.
[functions."social-post"]
  schedule = "*/10 * * * *"

# Social engagement stats poller — once daily at 17:00 UTC = 12 PM CDT.
# Was every 30 min (48/day) — Meta insights take 30+ min to populate so
# polling more often was useless. Manual refresh button on Performance tab.
[functions."social-poll-stats"]
  schedule = "0 17 * * *"

# Cadence engine — every 4 hours. Picks up newly added events/bands and
# rebuilds skeleton drafts; re-prioritizes when new high-priority items appear.
# Light operation (no AI calls), idempotent.
# DISABLED 2026-08-05 at the owner's request - was generating drafts nobody approved.
# Re-enable by uncommenting the two lines below.
# [functions."social-cadence-engine"]
#   schedule = "0 */4 * * *"

# Nightly social learning optimizer — 8:00 UTC = 3am CT.
# Mines engagement patterns into social_learnings.json so future captions improve.
# DISABLED 2026-08-05 at the owner's request - was generating drafts nobody approved.
# Re-enable by uncommenting the two lines below.
# [functions."social-optimize"]
#   schedule = "0 8 * * *"

# Weather-aware atmosphere posts — 11:00 UTC = 6am CT. Reads forecast and
# creates patio-perfect or cozy-fireside skeleton drafts for today/tomorrow.
# DISABLED 2026-08-05 at the owner's request - was generating drafts nobody approved.
# Re-enable by uncommenting the two lines below.
# [functions."social-weather-trigger"]
#   schedule = "0 11 * * *"

# ─── REWARDS ────────────────────────────────────────────────────────────────
# Tier-decay daily check — 14:00 UTC = 9am CDT / 8am CST. Sends a "visit by
# month-end" warning at 30 days inactive; drops tier one level at 60 days.
# Points themselves never expire — only the tier perks decay. See
# expire-tiers.js for the rules; rewards.json defines the windows.
[functions."expire-tiers"]
  schedule = "0 14 * * *"

# Welcome-series nudges — 15:00 UTC = 10am CDT / 9am CST. Day-3 "haven't been
# back yet?" (only if no visits) and Day-7 "how tiers work" educational email.
# One-per-email guard via member.welcomeSeriesSent.
[functions."welcome-series"]
  schedule = "0 15 * * *"
