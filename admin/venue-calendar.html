<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Quarry — Venue Day View</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f4f5f7;
            --bg-secondary: #ffffff;
            --bg-card: #ffffff;
            --bg-elevated: #f0f1f3;
            --bg-hover: #eef0f4;
            --border-subtle: #e0e3e8;
            --border-medium: #cdd1d8;
            --text-primary: #1c1f26;
            --text-secondary: #4b5263;
            --text-muted: #858d9e;
            --gold: #9a7b2a;
            --gold-light: #b08e30;
            --gold-dim: rgba(154, 123, 42, 0.07);
            --green: #16a34a;
            --green-dim: rgba(22, 163, 74, 0.08);
            --red: #dc2626;
            --red-dim: rgba(220, 38, 38, 0.06);
            --radius-sm: 8px;
            --radius-md: 12px;
            --radius-lg: 16px;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04), 0 1px 4px rgba(0,0,0,0.03);
            --shadow-md: 0 2px 8px rgba(0,0,0,0.06), 0 4px 16px rgba(0,0,0,0.04);
            --shadow-lg: 0 4px 12px rgba(0,0,0,0.06), 0 12px 40px rgba(0,0,0,0.08);
            --font-sans: 'Montserrat', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-serif: 'Playfair Display', Georgia, serif;
        }
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { width: 100%; min-height: 100%; background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-sans); -webkit-font-smoothing: antialiased; }
        .hidden { display: none !important; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: var(--border-subtle); border-radius: 3px; }

        /* ---- Login overlay (same pattern/token as admin/index.html) ---- */
        #loginOverlay { position: fixed; inset: 0; background: var(--bg-primary); display: flex; align-items: center; justify-content: center; z-index: 9999; }
        .login-container { background: var(--bg-card); border: 1px solid var(--border-subtle); padding: 2.5rem 2rem; border-radius: var(--radius-lg); width: 100%; max-width: 380px; box-shadow: var(--shadow-lg); }
        .login-header { font-family: var(--font-serif); font-size: 2rem; color: var(--gold); margin-bottom: 0.5rem; text-align: center; font-weight: 700; letter-spacing: 3px; }
        .login-subtitle { text-align: center; color: var(--text-muted); font-size: 0.85rem; margin-bottom: 2rem; letter-spacing: 1px; }
        .login-form { display: flex; flex-direction: column; gap: 1.25rem; }
        .login-form input { background: var(--bg-primary); border: 1px solid var(--border-subtle); color: var(--text-primary); padding: 0.8rem 1rem; border-radius: var(--radius-sm); font-size: 0.95rem; font-family: var(--font-sans); }
        .login-form input:focus { outline: none; border-color: var(--gold); box-shadow: 0 0 0 3px var(--gold-dim); }
        .login-button { background: var(--gold); color: #fff; border: none; padding: 0.8rem; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; font-size: 0.95rem; font-family: var(--font-sans); letter-spacing: 0.5px; }
        .login-button:hover { background: var(--gold-light); }
        .login-error { color: var(--red); text-align: center; font-size: 0.85rem; min-height: 1.1em; }

        /* ---- App shell ---- */
        #mainApp { max-width: 1180px; margin: 0 auto; padding: 28px 24px 80px; }
        .topbar { display: flex; align-items: baseline; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 22px; }
        .topbar h1 { font-family: var(--font-serif); font-size: 1.7rem; color: var(--text-primary); }
        .topbar h1 span { color: var(--gold); }
        .topbar a.back { font-size: 0.8rem; color: var(--text-muted); text-decoration: none; }
        .topbar a.back:hover { color: var(--gold); }

        .controls { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; background: var(--bg-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 12px 16px; margin-bottom: 20px; box-shadow: var(--shadow-sm); }
        .controls .navbtn { background: var(--bg-elevated); border: 1px solid var(--border-subtle); color: var(--text-primary); width: 32px; height: 32px; border-radius: 8px; cursor: pointer; font-size: 1rem; display: flex; align-items: center; justify-content: center; }
        .controls .navbtn:hover { background: var(--gold-dim); border-color: var(--gold); }
        .controls input[type=date] { border: 1px solid var(--border-subtle); border-radius: 8px; padding: 6px 10px; font-family: var(--font-sans); font-size: 0.85rem; background: var(--bg-primary); color: var(--text-primary); }
        .controls select { border: 1px solid var(--border-subtle); border-radius: 8px; padding: 6px 10px; font-family: var(--font-sans); font-size: 0.85rem; background: var(--bg-primary); color: var(--text-primary); }
        .controls .today-btn { border: 1px solid var(--gold); color: var(--gold); background: transparent; border-radius: 8px; padding: 6px 12px; font-size: 0.8rem; font-weight: 600; cursor: pointer; }
        .controls .today-btn:hover { background: var(--gold-dim); }
        .controls .spacer { flex: 1; }
        .controls .refresh { font-size: 0.75rem; color: var(--text-muted); }

        .alertbar { background: var(--red-dim); border: 1px solid rgba(220,38,38,0.3); color: var(--red); border-radius: var(--radius-md); padding: 12px 16px; margin-bottom: 18px; font-size: 0.85rem; }
        .alertbar strong { display:block; margin-bottom:4px; }

        .daygroup { margin-bottom: 30px; }
        .daygroup-header { font-family: var(--font-serif); font-size: 1.15rem; color: var(--text-primary); border-bottom: 2px solid var(--gold-dim); padding-bottom: 8px; margin-bottom: 14px; display:flex; align-items:baseline; gap:10px; }
        .daygroup-header .count { font-family: var(--font-sans); font-size: 0.75rem; color: var(--text-muted); font-weight: 500; }
        .empty-day { color: var(--text-muted); font-size: 0.85rem; font-style: italic; padding: 6px 0 0; }

        .space-block { margin-bottom: 14px; }
        .space-title { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-muted); font-weight: 600; margin-bottom: 6px; display:flex; align-items:center; gap:6px; }
        .space-title .dot { width:8px; height:8px; border-radius:50%; display:inline-block; }

        .bcard { background: var(--bg-card); border: 1px solid var(--border-subtle); border-left: 4px solid var(--gold); border-radius: var(--radius-sm); padding: 10px 14px; margin-bottom: 8px; box-shadow: var(--shadow-sm); cursor: pointer; }
        .bcard:hover { box-shadow: var(--shadow-md); }
        .bcard .row1 { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }
        .bcard .title { font-weight: 600; font-size: 0.92rem; }
        .bcard .time { font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; }
        .bcard .card-actions { display: flex; align-items: center; gap: 10px; }
        .bcard .edit-btn { background: transparent; border: 1px solid var(--border-subtle); color: var(--text-secondary); font-size: 0.72rem; font-weight: 600; padding: 3px 9px; border-radius: 6px; cursor: pointer; font-family: var(--font-sans); }
        .bcard .edit-btn:hover { background: var(--gold-dim); border-color: var(--gold); color: var(--text-primary); }
        .bcard .booked-by { font-size: 0.78rem; color: var(--text-secondary); margin-top: 3px; }
        .bcard .meta { font-size: 0.78rem; color: var(--text-muted); margin-top: 4px; }
        .badge { display: inline-block; font-size: 0.68rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; padding: 2px 8px; border-radius: 999px; margin-left: 6px; }
        .badge.status-confirmed { background: var(--green-dim); color: var(--green); }
        .badge.status-tentative { background: rgba(180,83,9,0.09); color: #b45309; }
        .badge.status-inquiry { background: rgba(37,99,235,0.08); color: #2563eb; }
        .badge.status-completed { background: var(--bg-elevated); color: var(--text-muted); }
        .badge.needs-space { background: var(--red-dim); color: var(--red); }
        .badge.money-owed { background: var(--red-dim); color: var(--red); }
        .badge.money-paid { background: var(--green-dim); color: var(--green); }

        .details { display:none; margin-top:10px; padding-top:10px; border-top: 1px dashed var(--border-subtle); font-size: 0.82rem; color: var(--text-secondary); }
        .details.open { display:block; }
        .details div { margin-bottom: 4px; }
        .details b { color: var(--text-primary); }

        .legend { display: flex; flex-wrap: wrap; gap: 10px 16px; margin: 18px 0 26px; font-size: 0.72rem; color: var(--text-muted); }
        .legend .item { display: flex; align-items: center; gap: 5px; }
        .legend .dot { width: 9px; height: 9px; border-radius: 50%; }

        .loading, .err { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 0.9rem; }
        .err { color: var(--red); }

        /* ---- New Booking form ---- */
        .new-booking-btn { background: var(--gold); color: #fff; border: none; border-radius: 8px; padding: 6px 14px; font-size: 0.8rem; font-weight: 600; cursor: pointer; font-family: var(--font-sans); }
        .new-booking-btn:hover { background: var(--gold-light); }
        .modal-overlay { position: fixed; inset: 0; background: rgba(20,20,24,0.55); display: flex; align-items: center; justify-content: center; z-index: 1000; padding: 20px; }
        .modal-overlay.hidden { display: none; }
        .modal-box { background: var(--bg-card); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); width: 100%; max-width: 640px; max-height: 90vh; overflow-y: auto; padding: 26px 28px 28px; }
        .modal-box h2 { font-family: var(--font-serif); font-size: 1.3rem; margin-bottom: 18px; }
        .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px 14px; }
        .form-grid .full { grid-column: 1 / -1; }
        .form-grid label { display: block; font-size: 0.75rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
        .form-grid input:not([type="checkbox"]), .form-grid select, .form-grid textarea { width: 100%; border: 1px solid var(--border-subtle); border-radius: 8px; padding: 7px 10px; font-family: var(--font-sans); font-size: 0.85rem; background: var(--bg-primary); color: var(--text-primary); box-sizing: border-box; }
        .form-grid textarea { resize: vertical; min-height: 54px; }
        .form-grid input[type="checkbox"] { width: 16px; height: 16px; flex-shrink: 0; margin: 0; accent-color: var(--gold); }
        .space-checks { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px 16px; }
        .space-checks label { display: flex; align-items: flex-start; gap: 6px; font-size: 0.8rem; font-weight: 500; text-transform: none; color: var(--text-primary); }
        .space-checks input[type="checkbox"] { margin-top: 2px; }
        .form-checkbox { display: flex; align-items: center; gap: 6px; }
        .form-checkbox label { text-transform: none; font-size: 0.82rem; font-weight: 500; margin: 0; }
        .modal-actions { display: flex; justify-content: flex-end; gap: 10px; margin-top: 20px; }
        .modal-actions button { padding: 8px 18px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer; font-family: var(--font-sans); }
        .modal-cancel { background: transparent; border: 1px solid var(--border-subtle); color: var(--text-secondary); }
        .modal-cancel:hover { background: var(--bg-elevated); }
        .modal-submit { background: var(--gold); border: none; color: #fff; }
        .modal-submit:hover { background: var(--gold-light); }
        .modal-submit:disabled { opacity: 0.6; cursor: default; }
        .form-error { color: var(--red); font-size: 0.82rem; margin-top: 10px; min-height: 1.1em; }
        .form-conflict { background: var(--red-dim); border: 1px solid rgba(220,38,38,0.3); color: var(--red); border-radius: 8px; padding: 10px 12px; margin-top: 10px; font-size: 0.8rem; }

        /* ---- Billing / invoicing (edit mode only) ---- */
        .billing-section { margin-top: 22px; padding-top: 18px; border-top: 1px solid var(--border-subtle); }
        .billing-section h3 { font-family: var(--font-serif); font-size: 1.02rem; margin-bottom: 12px; }
        .li-table { width: 100%; border-collapse: collapse; margin-bottom: 10px; }
        .li-table th { text-align: left; font-size: 0.68rem; text-transform: uppercase; letter-spacing: 0.04em; color: var(--text-muted); font-weight: 600; padding: 0 6px 6px; }
        .li-table td { padding: 3px 6px; vertical-align: middle; }
        .li-table input { width: 100%; border: 1px solid var(--border-subtle); border-radius: 6px; padding: 5px 7px; font-family: var(--font-sans); font-size: 0.8rem; background: var(--bg-primary); color: var(--text-primary); box-sizing: border-box; }
        .li-table .li-qty, .li-table .li-price { width: 70px; }
        .li-table .li-remove { background: transparent; border: none; color: var(--red); cursor: pointer; font-size: 1rem; padding: 2px 6px; }
        .li-add-btn { background: transparent; border: 1px dashed var(--border-medium); color: var(--text-secondary); border-radius: 8px; padding: 6px 12px; font-size: 0.78rem; cursor: pointer; font-family: var(--font-sans); }
        .li-add-btn:hover { border-color: var(--gold); color: var(--gold); }
        .li-total { text-align: right; font-size: 0.85rem; margin: 8px 0 4px; color: var(--text-secondary); }
        .li-total strong { color: var(--text-primary); }
        .invoice-row { display: flex; gap: 10px; align-items: flex-end; flex-wrap: wrap; margin-top: 14px; }
        .invoice-row .field { flex: 1; min-width: 120px; }
        .invoice-row label { display: block; font-size: 0.72rem; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.03em; }
        .invoice-row input { width: 100%; border: 1px solid var(--border-subtle); border-radius: 8px; padding: 7px 10px; font-family: var(--font-sans); font-size: 0.85rem; background: var(--bg-primary); color: var(--text-primary); box-sizing: border-box; }
        .send-invoice-btn { background: var(--gold); border: none; color: #fff; border-radius: 8px; padding: 8px 16px; font-size: 0.82rem; font-weight: 600; cursor: pointer; font-family: var(--font-sans); white-space: nowrap; }
        .send-invoice-btn:hover { background: var(--gold-light); }
        .send-invoice-btn:disabled { opacity: 0.6; cursor: default; }
        .invoice-msg { font-size: 0.8rem; margin-top: 8px; }
        .invoice-msg.err { color: var(--red); }
        .invoice-msg.ok { color: var(--green); }
        .payment-history { margin-top: 14px; font-size: 0.8rem; }
        .payment-history .ph-row { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--border-subtle); }
        .payment-history .ph-row:last-child { border-bottom: none; }
        .payment-history a { color: var(--gold); text-decoration: none; }
        .payment-history a:hover { text-decoration: underline; }
        .ph-status { font-size: 0.68rem; text-transform: uppercase; font-weight: 600; padding: 1px 7px; border-radius: 999px; }
        .ph-status.paid { background: var(--green-dim); color: var(--green); }
        .ph-status.unpaid { background: var(--red-dim); color: var(--red); }
    </style>
</head>
<body>

    <div id="loginOverlay">
        <div class="login-container">
            <div class="login-header">THE QUARRY</div>
            <div class="login-subtitle">Venue Day View — Staff Only</div>
            <form class="login-form" id="loginForm">
                <input type="password" id="passwordInput" placeholder="Enter admin password" required autocomplete="current-password">
                <button type="submit" class="login-button">Sign In</button>
                <div class="login-error" id="loginError"></div>
            </form>
        </div>
    </div>

    <div id="mainApp" class="hidden">
        <div class="topbar">
            <h1>Venue <span>Day View</span></h1>
            <a class="back" href="/admin/">&larr; Back to Admin</a>
        </div>

        <div class="controls">
            <button class="navbtn" id="prevBtn" title="Previous">&larr;</button>
            <input type="date" id="dateInput">
            <button class="navbtn" id="nextBtn" title="Next">&rarr;</button>
            <button class="today-btn" id="todayBtn">Today</button>
            <select id="spanSelect">
                <option value="1">1 day</option>
                <option value="3">3 days</option>
                <option value="7" selected>7 days</option>
                <option value="14">14 days</option>
                <option value="30">30 days</option>
            </select>
            <div class="spacer"></div>
            <span class="refresh" id="refreshNote"></span>
            <button class="new-booking-btn" id="newBookingBtn">+ New Booking</button>
        </div>

        <div id="alertZone"></div>
        <div id="legendZone" class="legend hidden"></div>
        <div id="resultZone"><div class="loading">Loading…</div></div>
    </div>

    <div id="bookingModal" class="modal-overlay hidden">
        <div class="modal-box">
            <h2 id="bModalTitle">New Booking</h2>
            <form id="bookingForm">
                <div class="form-grid">
                    <div class="full">
                        <label for="bTitle">Event name</label>
                        <input type="text" id="bTitle" required placeholder="e.g. Smith Birthday Party">
                    </div>
                    <div>
                        <label for="bEventType">Event type</label>
                        <select id="bEventType"></select>
                    </div>
                    <div>
                        <label for="bStatus">Status</label>
                        <select id="bStatus">
                            <option value="confirmed" selected>Confirmed</option>
                            <option value="tentative">Tentative</option>
                            <option value="inquiry">Inquiry</option>
                        </select>
                    </div>
                    <div>
                        <label for="bStart">Starts</label>
                        <input type="datetime-local" id="bStart" required>
                    </div>
                    <div>
                        <label for="bEnd">Ends</label>
                        <input type="datetime-local" id="bEnd" required>
                    </div>
                    <div class="full">
                        <label>Spaces</label>
                        <div class="space-checks" id="spaceChecks"></div>
                    </div>
                    <div class="full form-checkbox">
                        <input type="checkbox" id="bExclusive">
                        <label for="bExclusive">Exclusive (whole-venue buyout — blocks other bookings)</label>
                    </div>
                    <div>
                        <label for="bGuestCount">Guest count</label>
                        <input type="number" id="bGuestCount" min="0">
                    </div>
                    <div>
                        <label for="bOccasion">Occasion</label>
                        <input type="text" id="bOccasion">
                    </div>
                    <div>
                        <label for="bContactName">Name</label>
                        <input type="text" id="bContactName" required>
                    </div>
                    <div>
                        <label for="bCompany">Company (optional)</label>
                        <input type="text" id="bCompany">
                    </div>
                    <div>
                        <label for="bContactPhone">Phone</label>
                        <input type="tel" id="bContactPhone">
                    </div>
                    <div>
                        <label for="bContactEmail">Email</label>
                        <input type="email" id="bContactEmail">
                    </div>
                    <div class="full" style="margin-top:-6px;">
                        <span style="font-size:0.72rem;color:var(--text-muted);">Phone or email — at least one is required.</span>
                    </div>
                    <div class="full form-checkbox">
                        <input type="checkbox" id="bCateringRequired">
                        <label for="bCateringRequired">Catering</label>
                    </div>
                    <div class="full">
                        <label for="bCateringPackage">Catering details</label>
                        <input type="text" id="bCateringPackage" placeholder="e.g. Plated dinner for 80, bar package B">
                    </div>
                    <div>
                        <label for="bDepositPaid">Deposit paid ($)</label>
                        <input type="number" id="bDepositPaid" min="0" step="0.01">
                    </div>
                    <div>
                        <label for="bBalanceDue">Money owed ($)</label>
                        <input type="number" id="bBalanceDue" min="0" step="0.01">
                    </div>
                    <div>
                        <label for="bBookedBy">Employee name</label>
                        <input type="text" id="bBookedBy" placeholder="Who's entering this booking?">
                    </div>
                    <div class="full">
                        <label for="bNotes">Additional notes</label>
                        <textarea id="bNotes"></textarea>
                    </div>
                </div>
                <div class="form-error" id="bFormError"></div>
                <div id="bConflictZone"></div>
                <div class="modal-actions">
                    <button type="button" class="modal-cancel" id="bCancelBtn">Cancel</button>
                    <button type="submit" class="modal-submit" id="bSubmitBtn">Save Booking</button>
                </div>
            </form>

            <div class="billing-section hidden" id="billingSection">
                <h3>Catering &amp; Invoicing</h3>
                <table class="li-table">
                    <thead>
                        <tr><th style="width:110px;">Category</th><th>Item</th><th class="li-qty">Qty</th><th class="li-price">Unit $</th><th></th></tr>
                    </thead>
                    <tbody id="liRows"></tbody>
                </table>
                <button type="button" class="li-add-btn" id="liAddBtn">+ Add line item</button>
                <div class="li-total" id="liTotal"></div>

                <div class="invoice-row">
                    <div class="field">
                        <label for="invLabel">Invoice label</label>
                        <input type="text" id="invLabel" placeholder="e.g. Deposit">
                    </div>
                    <div class="field">
                        <label for="invAmount">Amount ($, if no items)</label>
                        <input type="number" id="invAmount" min="0" step="0.01">
                    </div>
                    <div class="field">
                        <label for="invDueDate">Due date</label>
                        <input type="date" id="invDueDate">
                    </div>
                    <button type="button" class="send-invoice-btn" id="sendInvoiceBtn">Send Invoice</button>
                </div>
                <div class="invoice-msg" id="invoiceMsg"></div>

                <div class="payment-history" id="paymentHistory"></div>
            </div>
        </div>
    </div>

<script>
(function () {
    var API_LOGIN = '/.netlify/functions/verify-admin-password';
    var API_DATA = '/.netlify/functions/venue-day-view';
    var API_BOOKING_WRITE = '/.netlify/functions/venue-booking-write';
    var API_LINE_ITEMS = '/.netlify/functions/venue-booking-line-items';
    var API_INVOICE_CREATE = '/.netlify/functions/venue-booking-invoice-create';

    var EVENT_COLORS = {
        wedding: '#9a7b2a', rehearsal_dinner: '#2563eb', birthday: '#d6336c',
        private_event: '#6b7280', bridal_shower: '#8b5cf6', wine_club: '#16a34a',
        baby_shower: '#0d9488', corporate: '#1e3a8a', engagement_party: '#e11d48',
        anniversary: '#ea580c', reunion: '#78350f', bachelorette: '#c026d3',
        bingo: '#0891b2', market_event: '#65a30d', fundraiser: '#dc2626',
        retirement_party: '#475569', holiday_party: '#b91c1c', pop_up_bar: '#d97706',
        celebration_of_life: '#4b5563', golf: '#2f6b4f'
    };
    function colorFor(type) { return EVENT_COLORS[type] || '#9a7b2a'; }
    function labelize(s) { return String(s || '').replace(/_/g, ' ').replace(/\b\w/g, function (c) { return c.toUpperCase(); }); }

    var SPACE_ORDER = ['whole-venue', 'building', 'golf', 'bay-1', 'bay-2', 'bay-3', 'bay-4', 'upper-patio', 'lower-patio', 'back-patio', 'turf'];
    var SPACE_NAMES = {
        'whole-venue': 'Whole Venue (Buyout)', 'building': 'Building (Indoor Dining & Bar)',
        'golf': 'Golf Simulator Area', 'bay-1': 'Golf Bay 1', 'bay-2': 'Golf Bay 2',
        'bay-3': 'Golf Bay 3', 'bay-4': 'Golf Bay 4', 'upper-patio': 'Upper Patio',
        'lower-patio': 'Lower Patio', 'back-patio': 'Back Patio', 'turf': 'Turf / Lawn'
    };

    // ---------------- AUTH ----------------
    function showApp() {
        document.getElementById('loginOverlay').classList.add('hidden');
        document.getElementById('mainApp').classList.remove('hidden');
        init();
    }

    (function restoreSession() {
        var tok = localStorage.getItem('quarryAdminToken');
        if (!tok) return;
        fetch(API_LOGIN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: 'verify', token: tok }) })
            .then(function (r) { return r.json(); })
            .then(function (body) { if (body.ok) showApp(); })
            .catch(function () {});
    })();

    document.getElementById('loginForm').addEventListener('submit', function (e) {
        e.preventDefault();
        var password = (document.getElementById('passwordInput').value || '').trim();
        var errorEl = document.getElementById('loginError');
        errorEl.textContent = 'Verifying…';
        fetch(API_LOGIN, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: password }) })
            .then(function (r) { return r.json(); })
            .then(function (body) {
                if (body.ok) {
                    if (body.token) localStorage.setItem('quarryAdminToken', body.token);
                    showApp();
                } else {
                    errorEl.textContent = 'Incorrect password.';
                }
            })
            .catch(function () { errorEl.textContent = 'Could not reach the server.'; });
    });

    // ---------------- APP STATE ----------------
    var state = { start: todayStr(), days: 7, spacesById: {}, bookingsById: {}, editingId: null, lineItems: [], payments: [] };

    function todayStr() {
        var d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    }
    function addDays(ymd, n) {
        var parts = ymd.split('-').map(Number);
        var d = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
        d.setUTCDate(d.getUTCDate() + n);
        return d.getUTCFullYear() + '-' + String(d.getUTCMonth() + 1).padStart(2, '0') + '-' + String(d.getUTCDate()).padStart(2, '0');
    }
    function fmtDayHeader(ymd) {
        var parts = ymd.split('-').map(Number);
        var d = new Date(Date.UTC(parts[0], parts[1] - 1, parts[2]));
        return d.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
    }
    function fmtTime(iso) {
        return new Date(iso).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Chicago' });
    }

    function init() {
        document.getElementById('dateInput').value = state.start;
        document.getElementById('spanSelect').value = String(state.days);
        document.getElementById('prevBtn').addEventListener('click', function () { navigate(-1); });
        document.getElementById('nextBtn').addEventListener('click', function () { navigate(1); });
        document.getElementById('todayBtn').addEventListener('click', function () { state.start = todayStr(); document.getElementById('dateInput').value = state.start; load(); });
        document.getElementById('dateInput').addEventListener('change', function (e) { state.start = e.target.value; load(); });
        document.getElementById('spanSelect').addEventListener('change', function (e) { state.days = parseInt(e.target.value, 10); load(); });
        initBookingForm();
        initBillingSection();
        load();
    }

    // ---------------- NEW / EDIT BOOKING FORM ----------------
    // datetime-local inputs need the venue's local (Central) wall-clock time,
    // not the UTC instant the API returns — build it the same way fmtTime
    // parses for display, just formatted for an <input> instead of a label.
    function toLocalInputValue(iso) {
        var parts = new Intl.DateTimeFormat('en-US', {
            timeZone: 'America/Chicago', year: 'numeric', month: '2-digit', day: '2-digit',
            hour: '2-digit', minute: '2-digit', hour12: false
        }).formatToParts(new Date(iso));
        var map = {};
        parts.forEach(function (p) { map[p.type] = p.value; });
        var hour = map.hour === '24' ? '00' : map.hour;
        return map.year + '-' + map.month + '-' + map.day + 'T' + hour + ':' + map.minute;
    }

    var openModal, closeModal;

    function initBookingForm() {
        var typeSelect = document.getElementById('bEventType');
        typeSelect.innerHTML = Object.keys(EVENT_COLORS).map(function (t) {
            return '<option value="' + t + '">' + labelize(t) + '</option>';
        }).join('');

        var spaceZone = document.getElementById('spaceChecks');
        spaceZone.innerHTML = SPACE_ORDER.map(function (id) {
            return '<label><input type="checkbox" value="' + id + '" class="space-check"> ' + (SPACE_NAMES[id] || id) + '</label>';
        }).join('');

        var overlay = document.getElementById('bookingModal');
        var form = document.getElementById('bookingForm');
        var titleEl = document.getElementById('bModalTitle');
        var submitBtn = document.getElementById('bSubmitBtn');

        openModal = function (booking) {
            form.reset();
            document.getElementById('bFormError').textContent = '';
            document.getElementById('bConflictZone').innerHTML = '';
            state.editingId = booking ? booking.id : null;
            titleEl.textContent = booking ? 'Edit Booking' : 'New Booking';
            submitBtn.textContent = booking ? 'Save Changes' : 'Save Booking';

            if (booking) {
                document.getElementById('bTitle').value = booking.title || '';
                typeSelect.value = booking.event_type || '';
                document.getElementById('bStatus').value = booking.status || 'confirmed';
                document.getElementById('bStart').value = toLocalInputValue(booking.starts_at);
                document.getElementById('bEnd').value = toLocalInputValue(booking.ends_at);
                document.getElementById('bExclusive').checked = !!booking.exclusive;
                document.getElementById('bGuestCount').value = booking.guest_count || '';
                document.getElementById('bOccasion').value = booking.occasion || '';
                document.getElementById('bContactName').value = booking.contact_name || '';
                document.getElementById('bCompany').value = booking.company || '';
                document.getElementById('bContactPhone').value = booking.contact_phone || '';
                document.getElementById('bContactEmail').value = booking.contact_email || '';
                document.getElementById('bCateringRequired').checked = !!booking.catering_required;
                document.getElementById('bCateringPackage').value = booking.catering_package || '';
                document.getElementById('bDepositPaid').value = booking.deposit_paid != null ? booking.deposit_paid : '';
                document.getElementById('bBalanceDue').value = booking.balance_due != null ? booking.balance_due : '';
                document.getElementById('bBookedBy').value = booking.booked_by || '';
                document.getElementById('bNotes').value = booking.notes || '';
                var selectedSpaces = booking.direct_spaces || [];
                Array.prototype.forEach.call(document.querySelectorAll('.space-check'), function (cb) {
                    cb.checked = selectedSpaces.indexOf(cb.value) !== -1;
                });
            } else {
                document.getElementById('bStart').value = state.start + 'T18:00';
                document.getElementById('bEnd').value = state.start + 'T22:00';
            }

            var billingSection = document.getElementById('billingSection');
            var editable = booking && booking.source !== 'wedding portal';
            if (editable) {
                billingSection.classList.remove('hidden');
                document.getElementById('invDueDate').value = addDays(todayStr(), 7);
                document.getElementById('invLabel').value = '';
                document.getElementById('invAmount').value = '';
                loadBilling(booking.id);
            } else {
                billingSection.classList.add('hidden');
                state.lineItems = []; state.payments = [];
            }

            overlay.classList.remove('hidden');
        };
        closeModal = function () { overlay.classList.add('hidden'); state.editingId = null; };

        document.getElementById('newBookingBtn').addEventListener('click', function () { openModal(); });
        document.getElementById('bCancelBtn').addEventListener('click', closeModal);
        overlay.addEventListener('click', function (e) { if (e.target === overlay) closeModal(); });

        form.addEventListener('submit', function (e) {
            e.preventDefault();
            var errorEl = document.getElementById('bFormError');
            var conflictZone = document.getElementById('bConflictZone');
            errorEl.textContent = '';
            conflictZone.innerHTML = '';

            var startVal = document.getElementById('bStart').value;
            var endVal = document.getElementById('bEnd').value;
            if (!startVal || !endVal) { errorEl.textContent = 'Start and end times are required.'; return; }

            var spaceIds = Array.prototype.slice.call(document.querySelectorAll('.space-check:checked')).map(function (el) { return el.value; });

            var phoneVal = document.getElementById('bContactPhone').value.trim();
            var emailVal = document.getElementById('bContactEmail').value.trim();
            if (!phoneVal && !emailVal) { errorEl.textContent = 'Enter a phone number or an email — at least one is required.'; return; }

            var isEditing = !!state.editingId;
            var payload = {
                token: localStorage.getItem('quarryAdminToken') || '',
                id: isEditing ? state.editingId : undefined,
                title: document.getElementById('bTitle').value.trim(),
                event_type: typeSelect.value,
                status: document.getElementById('bStatus').value,
                exclusive: document.getElementById('bExclusive').checked,
                starts_at: new Date(startVal).toISOString(),
                ends_at: new Date(endVal).toISOString(),
                guest_count: document.getElementById('bGuestCount').value ? parseInt(document.getElementById('bGuestCount').value, 10) : null,
                occasion: document.getElementById('bOccasion').value.trim() || null,
                contact_name: document.getElementById('bContactName').value.trim() || null,
                contact_phone: phoneVal || null,
                contact_email: emailVal || null,
                company: document.getElementById('bCompany').value.trim() || null,
                catering_required: document.getElementById('bCateringRequired').checked,
                catering_package: document.getElementById('bCateringPackage').value.trim() || null,
                deposit_paid: document.getElementById('bDepositPaid').value ? parseFloat(document.getElementById('bDepositPaid').value) : null,
                balance_due: document.getElementById('bBalanceDue').value ? parseFloat(document.getElementById('bBalanceDue').value) : null,
                booked_by: document.getElementById('bBookedBy').value.trim() || null,
                notes: document.getElementById('bNotes').value.trim() || null,
                space_ids: spaceIds,
            };

            if (!payload.title) { errorEl.textContent = 'Event name is required.'; return; }
            if (!payload.contact_name) { errorEl.textContent = 'Name is required.'; return; }
            if (new Date(payload.ends_at) <= new Date(payload.starts_at)) { errorEl.textContent = 'End time must be after start time.'; return; }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Saving…';

            fetch(API_BOOKING_WRITE, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
                .then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }); })
                .then(function (res) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = isEditing ? 'Save Changes' : 'Save Booking';
                    var expectedStatus = isEditing ? 200 : 201;
                    if (res.status !== expectedStatus) {
                        errorEl.textContent = 'Could not save: ' + (res.body.error || res.status);
                        return;
                    }
                    if (res.body.conflicts && res.body.conflicts.length) {
                        conflictZone.innerHTML = res.body.conflicts.map(function (c) {
                            return '<div class="form-conflict">⚠ ' + (c.message || 'Possible double-booking.') + '</div>';
                        }).join('');
                        // Leave the modal open so staff can see the conflict before deciding
                        // whether to adjust — the booking itself is already saved either way.
                        load();
                        return;
                    }
                    closeModal();
                    load();
                })
                .catch(function (e) {
                    submitBtn.disabled = false;
                    submitBtn.textContent = isEditing ? 'Save Changes' : 'Save Booking';
                    errorEl.textContent = 'Network error: ' + e.message;
                });
        });
    }

    // ---------------- BILLING / INVOICING (edit mode only) ----------------
    function fmtMoney(n) { return '$' + (Number(n) || 0).toFixed(2); }

    function renderLineItems() {
        var rowsEl = document.getElementById('liRows');
        rowsEl.innerHTML = state.lineItems.map(function (it, i) {
            return '<tr data-idx="' + i + '">' +
                '<td><input type="text" class="li-category" value="' + esc(it.category || 'Catering') + '"></td>' +
                '<td><input type="text" class="li-label" value="' + esc(it.label || '') + '" placeholder="e.g. Plated dinner"></td>' +
                '<td><input type="number" class="li-qty" min="0" step="1" value="' + esc(it.quantity != null ? it.quantity : 1) + '"></td>' +
                '<td><input type="number" class="li-price" min="0" step="0.01" value="' + esc(it.unit_price != null ? it.unit_price : 0) + '"></td>' +
                '<td><button type="button" class="li-remove" data-idx="' + i + '" title="Remove">&times;</button></td>' +
                '</tr>';
        }).join('');

        Array.prototype.forEach.call(rowsEl.querySelectorAll('tr'), function (tr) {
            var idx = parseInt(tr.dataset.idx, 10);
            tr.querySelector('.li-category').addEventListener('input', function (e) { state.lineItems[idx].category = e.target.value; });
            tr.querySelector('.li-label').addEventListener('input', function (e) { state.lineItems[idx].label = e.target.value; });
            tr.querySelector('.li-qty').addEventListener('input', function (e) { state.lineItems[idx].quantity = parseFloat(e.target.value) || 0; renderLiTotal(); });
            tr.querySelector('.li-price').addEventListener('input', function (e) { state.lineItems[idx].unit_price = parseFloat(e.target.value) || 0; renderLiTotal(); });
        });
        Array.prototype.forEach.call(rowsEl.querySelectorAll('.li-remove'), function (btn) {
            btn.addEventListener('click', function () {
                state.lineItems.splice(parseInt(btn.dataset.idx, 10), 1);
                renderLineItems();
                renderLiTotal();
            });
        });
        renderLiTotal();
    }

    function renderLiTotal() {
        var total = state.lineItems.reduce(function (s, it) { return s + (Number(it.quantity) || 0) * (Number(it.unit_price) || 0); }, 0);
        document.getElementById('liTotal').innerHTML = state.lineItems.length ? ('Total: <strong>' + fmtMoney(total) + '</strong>') : '';
    }

    function renderPaymentHistory() {
        var zone = document.getElementById('paymentHistory');
        if (!state.payments.length) { zone.innerHTML = ''; return; }
        zone.innerHTML = state.payments.map(function (p) {
            var statusClass = p.paid ? 'paid' : 'unpaid';
            var statusLabel = p.paid ? 'Paid' : (p.square_invoice_status || 'Sent');
            var link = p.square_public_url ? ' &middot; <a href="' + esc(p.square_public_url) + '" target="_blank" rel="noopener">View invoice</a>' : '';
            return '<div class="ph-row"><span>' + esc(p.label) + ' — ' + fmtMoney(p.amount) + link + '</span><span class="ph-status ' + statusClass + '">' + esc(statusLabel) + '</span></div>';
        }).join('');
    }

    function loadBilling(bookingId) {
        document.getElementById('liRows').innerHTML = '';
        document.getElementById('liTotal').textContent = '';
        document.getElementById('paymentHistory').innerHTML = '';
        document.getElementById('invoiceMsg').textContent = '';
        var tok = localStorage.getItem('quarryAdminToken') || '';
        fetch(API_LINE_ITEMS + '?token=' + encodeURIComponent(tok) + '&booking_id=' + encodeURIComponent(bookingId))
            .then(function (r) { return r.json(); })
            .then(function (body) {
                state.lineItems = (body.line_items || []).map(function (it) { return { category: it.category, label: it.label, quantity: it.quantity, unit_price: it.unit_price }; });
                state.payments = body.payments || [];
                renderLineItems();
                renderPaymentHistory();
            })
            .catch(function () { document.getElementById('invoiceMsg').textContent = 'Could not load billing info.'; });
    }

    function initBillingSection() {
        document.getElementById('liAddBtn').addEventListener('click', function () {
            state.lineItems.push({ category: 'Catering', label: '', quantity: 1, unit_price: 0 });
            renderLineItems();
        });

        document.getElementById('sendInvoiceBtn').addEventListener('click', function () {
            var msgEl = document.getElementById('invoiceMsg');
            msgEl.className = 'invoice-msg';
            msgEl.textContent = '';
            if (!state.editingId) return;

            var hasItems = state.lineItems.some(function (it) { return (it.label || '').trim(); });
            var manualAmount = parseFloat(document.getElementById('invAmount').value);
            if (!hasItems && !(manualAmount > 0)) {
                msgEl.className = 'invoice-msg err';
                msgEl.textContent = 'Add at least one line item, or enter a manual amount.';
                return;
            }

            var tok = localStorage.getItem('quarryAdminToken') || '';
            var btn = document.getElementById('sendInvoiceBtn');
            btn.disabled = true;
            btn.textContent = 'Sending…';

            fetch(API_LINE_ITEMS, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: tok, booking_id: state.editingId, line_items: hasItems ? state.lineItems : [] }),
            })
                .then(function (r) { return r.json(); })
                .then(function () {
                    return fetch(API_INVOICE_CREATE, {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            token: tok,
                            booking_id: state.editingId,
                            label: document.getElementById('invLabel').value.trim() || undefined,
                            amount: hasItems ? undefined : manualAmount,
                            due_date: document.getElementById('invDueDate').value || undefined,
                        }),
                    });
                })
                .then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }); })
                .then(function (res) {
                    btn.disabled = false;
                    btn.textContent = 'Send Invoice';
                    if (res.status !== 201) {
                        msgEl.className = 'invoice-msg err';
                        msgEl.textContent = 'Could not send invoice: ' + (res.body.message || res.body.error || res.status);
                        return;
                    }
                    msgEl.className = 'invoice-msg ok';
                    msgEl.textContent = 'Invoice sent to ' + res.body.sent_to + '.';
                    document.getElementById('invAmount').value = '';
                    loadBilling(state.editingId);
                })
                .catch(function (e) {
                    btn.disabled = false;
                    btn.textContent = 'Send Invoice';
                    msgEl.className = 'invoice-msg err';
                    msgEl.textContent = 'Network error: ' + e.message;
                });
        });
    }

    function openEditBooking(booking) {
        if (openModal) openModal(booking);
    }

    function navigate(dir) {
        var step = state.days > 1 ? state.days : 1;
        state.start = addDays(state.start, dir * step);
        document.getElementById('dateInput').value = state.start;
        load();
    }

    function load() {
        var resultZone = document.getElementById('resultZone');
        resultZone.innerHTML = '<div class="loading">Loading…</div>';
        var tok = localStorage.getItem('quarryAdminToken') || '';
        var url = API_DATA + '?token=' + encodeURIComponent(tok) + '&start=' + encodeURIComponent(state.start) + '&days=' + state.days;
        fetch(url).then(function (r) { return r.json().then(function (b) { return { status: r.status, body: b }; }); })
            .then(function (res) {
                if (res.status !== 200) {
                    resultZone.innerHTML = '<div class="err">Could not load bookings: ' + (res.body.error || res.status) + '</div>';
                    return;
                }
                render(res.body);
            })
            .catch(function (e) { resultZone.innerHTML = '<div class="err">Network error: ' + e.message + '</div>'; });
    }

    function render(data) {
        (data.spaces || []).forEach(function (s) { state.spacesById[s.id] = s; });
        state.bookingsById = {};
        (data.bookings || []).forEach(function (b) { state.bookingsById[b.id] = b; });
        document.getElementById('refreshNote').textContent = 'Loaded ' + (data.bookings || []).length + ' booking(s) · updated ' + new Date().toLocaleTimeString();

        renderAlerts(data.alerts || []);
        renderLegend(data.bookings || []);

        var byDay = {};
        for (var i = 0; i < state.days; i++) byDay[addDays(state.start, i)] = [];

        // Bucket by the venue's local calendar day, not the UTC day — a booking
        // starting at 8pm Central is already after midnight UTC, so comparing
        // raw UTC day windows was pushing evening bookings onto the next day.
        // ends_at is an exclusive boundary — a wedding block that runs midnight
        // to midnight ends exactly AT the next calendar date, so subtract a
        // moment before reading its local day, or it double-counts onto that
        // next day too.
        (data.bookings || []).forEach(function (b) {
            var startYmd = new Date(b.starts_at).toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
            var endYmd = new Date(new Date(b.ends_at).getTime() - 1).toLocaleDateString('en-CA', { timeZone: 'America/Chicago' });
            Object.keys(byDay).forEach(function (ymd) {
                if (ymd >= startYmd && ymd <= endYmd) byDay[ymd].push(b);
            });
        });

        var html = '';
        Object.keys(byDay).sort().forEach(function (ymd) {
            var bookings = byDay[ymd].slice().sort(function (a, b) { return new Date(a.starts_at) - new Date(b.starts_at); });
            html += '<div class="daygroup"><div class="daygroup-header">' + fmtDayHeader(ymd) + ' <span class="count">' + bookings.length + ' booking' + (bookings.length === 1 ? '' : 's') + '</span></div>';
            if (!bookings.length) {
                html += '<div class="empty-day">Nothing on the books.</div>';
            } else {
                var groups = {};
                bookings.forEach(function (b) {
                    var key = (b.direct_spaces && b.direct_spaces.length) ? b.direct_spaces.slice().sort().join('+') : '__unassigned';
                    (groups[key] = groups[key] || []).push(b);
                });
                var keys = Object.keys(groups).sort(function (a, b) {
                    if (a === '__unassigned') return 1;
                    if (b === '__unassigned') return -1;
                    return SPACE_ORDER.indexOf(a.split('+')[0]) - SPACE_ORDER.indexOf(b.split('+')[0]);
                });
                keys.forEach(function (key) {
                    var label = key === '__unassigned' ? 'Needs space assignment' :
                        key.split('+').map(function (id) { return (state.spacesById[id] || {}).name || id; }).join(' + ');
                    var dotColor = key === '__unassigned' ? '#dc2626' : (state.spacesById[key.split('+')[0]] || {}).color || '#9a7b2a';
                    html += '<div class="space-block"><div class="space-title"><span class="dot" style="background:' + dotColor + '"></span>' + label + '</div>';
                    groups[key].forEach(function (b) { html += bookingCard(b); });
                    html += '</div>';
                });
            }
            html += '</div>';
        });
        document.getElementById('resultZone').innerHTML = html || '<div class="empty-day">Nothing on the books.</div>';

        Array.prototype.forEach.call(document.querySelectorAll('.bcard'), function (el) {
            el.addEventListener('click', function (e) {
                if (e.target.closest('.edit-btn')) return; // handled below, don't also toggle details
                var d = el.querySelector('.details');
                if (d) d.classList.toggle('open');
            });
        });
        Array.prototype.forEach.call(document.querySelectorAll('.edit-btn'), function (el) {
            el.addEventListener('click', function (e) {
                e.stopPropagation();
                var booking = state.bookingsById[el.dataset.editId];
                if (booking) openEditBooking(booking);
            });
        });
    }

    function renderAlerts(alerts) {
        var zone = document.getElementById('alertZone');
        var unresolved = alerts.filter(function (a) { return !a.resolved_at; });
        if (!unresolved.length) { zone.innerHTML = ''; return; }
        var seen = {}, lines = [];
        unresolved.forEach(function (a) {
            var k = a.message + '|' + a.booking_id + '|' + a.wedding_id;
            if (seen[k]) return; seen[k] = true;
            lines.push(a.message);
        });
        zone.innerHTML = '<div class="alertbar"><strong>' + lines.length + ' unresolved conflict alert' + (lines.length === 1 ? '' : 's') + '</strong>' + lines.map(function (l) { return '&bull; ' + l; }).join('<br>') + '</div>';
    }

    function renderLegend(bookings) {
        var types = {};
        bookings.forEach(function (b) { types[b.event_type] = true; });
        var keys = Object.keys(types).sort();
        var zone = document.getElementById('legendZone');
        if (!keys.length) { zone.classList.add('hidden'); return; }
        zone.classList.remove('hidden');
        zone.innerHTML = keys.map(function (t) {
            return '<span class="item"><span class="dot" style="background:' + colorFor(t) + '"></span>' + labelize(t) + '</span>';
        }).join('');
    }

    function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }

    function bookingCard(b) {
        var needsSpace = !b.direct_spaces || !b.direct_spaces.length;
        var statusBadge = '<span class="badge status-' + esc(b.status) + '">' + esc(b.status) + '</span>';
        var typeBadge = '<span class="badge" style="background:' + colorFor(b.event_type) + '22;color:' + colorFor(b.event_type) + '">' + esc(labelize(b.event_type)) + '</span>';
        var needsBadge = needsSpace ? '<span class="badge needs-space">Needs space</span>' : '';
        var startLabel = fmtTime(b.starts_at), endLabel = fmtTime(b.ends_at);
        // A booking blocked start-of-day to start-of-day is a full-day hold (the
        // default for a wedding with no per-space windows narrowed yet) — "12:00
        // AM – 12:00 AM" reads like a data error, not "all day".
        var timeStr = (startLabel === '12:00 AM' && endLabel === '12:00 AM') ? 'All day' : (startLabel + ' – ' + endLabel);
        // Who booked it, right on the card face — no click needed to see this.
        var bookedByLabel = b.contact_name ? esc(b.contact_name) : '';
        // Paid/owed, right on the card face too — deposit_paid/balance_due update
        // automatically once a Square invoice sent from this calendar gets paid.
        var owed = Number(b.balance_due) || 0;
        var paidAmt = Number(b.deposit_paid) || 0;
        var moneyBadge = owed > 0 ? '<span class="badge money-owed">Owes ' + fmtMoney(owed) + '</span>'
            : (paidAmt > 0 ? '<span class="badge money-paid">Paid ' + fmtMoney(paidAmt) + '</span>' : '');
        var meta = [];
        if (b.guest_count) meta.push(b.guest_count + ' guests');
        if (b.exclusive) meta.push('Exclusive');
        if (b.catering_required) meta.push('Catering');
        if (b.ref) meta.push(b.ref);
        // Weddings are owned by the wedding_sync_booking trigger and get
        // clobbered on the wedding's next save, so editing them here would
        // silently revert — only offer Edit for bookings made in this form.
        var editable = b.source !== 'wedding portal';
        var editBtn = editable ? '<button type="button" class="edit-btn" data-edit-id="' + esc(b.id) + '" title="Edit booking">✎ Edit</button>' : '';

        var details = '<div class="details">';
        details += '<div><b>Contact:</b> ' + esc(b.contact_name || '—') +
            (b.contact_phone ? ' &middot; ' + esc(b.contact_phone) : '') +
            (b.contact_email ? ' &middot; ' + esc(b.contact_email) : '') + '</div>';
        if (b.occasion) details += '<div><b>Occasion:</b> ' + esc(b.occasion) + '</div>';
        if (b.notes) details += '<div><b>Notes:</b> ' + esc(b.notes) + '</div>';
        details += '<div><b>Source:</b> ' + esc(b.source || '—') + '</div>';
        // Per-space windows: a wedding's ceremony space usually frees up earlier
        // than its reception spaces, so only show this breakdown when the spaces
        // don't all share the booking's own start/end (nothing to add otherwise).
        var windows = (b.space_windows || []).filter(function (w) { return w.starts_at && w.ends_at; });
        var varies = windows.some(function (w) { return w.starts_at !== b.starts_at || w.ends_at !== b.ends_at; });
        if (windows.length && varies) {
            details += '<div><b>Space availability:</b></div>';
            windows.forEach(function (w) {
                var label = (state.spacesById[w.space_id] || {}).name || w.space_id;
                details += '<div style="padding-left:10px;">' + esc(label) + ': ' + fmtTime(w.starts_at) + ' – ' + fmtTime(w.ends_at) + '</div>';
            });
        }
        details += '</div>';

        return '<div class="bcard" data-booking-id="' + esc(b.id) + '" style="border-left-color:' + colorFor(b.event_type) + '">' +
            '<div class="row1"><span class="title">' + esc(b.title) + statusBadge + typeBadge + needsBadge + moneyBadge + '</span>' +
            '<span class="card-actions"><span class="time">' + timeStr + '</span>' + editBtn + '</span></div>' +
            (bookedByLabel ? '<div class="booked-by">Booked by ' + bookedByLabel + '</div>' : '') +
            (meta.length ? '<div class="meta">' + meta.map(esc).join(' &middot; ') + '</div>' : '') +
            details +
            '</div>';
    }
})();
</script>
</body>
</html>
