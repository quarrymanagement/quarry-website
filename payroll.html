<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Payroll — The Quarry</title>
<style>
  :root{
    --ink:#2E2A26; --stone:#5B544C; --muted:#8A827A; --line:#D8D2C8;
    --wash:#F4F1EC; --paper:#FCFBF9; --warn:#8A6D1F; --bad:#9A3412; --good:#166534;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--stone);
       font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
  h1,h2,h3{color:var(--ink);margin:0}
  .bar{background:var(--ink);color:#fff;padding:14px 20px;display:flex;
       align-items:center;gap:14px;flex-wrap:wrap}
  .bar h1{color:#fff;font-size:17px;font-weight:600}
  .bar .sp{flex:1}
  .bar .who{font-size:12.5px;color:#C3BAB0}
  .wrap{max-width:1160px;margin:0 auto;padding:20px}

  /* login */
  .login{max-width:360px;margin:12vh auto;background:#fff;border:1px solid var(--line);
         border-radius:12px;padding:26px}
  .login h2{font-size:18px;margin-bottom:4px}
  .login p{font-size:13px;color:var(--muted);margin:0 0 18px}
  label{display:block;font-size:12px;text-transform:uppercase;letter-spacing:.04em;
        color:var(--muted);margin:12px 0 4px}
  input{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:8px;
        font:inherit;background:#fff}
  input:focus{outline:2px solid var(--ink);outline-offset:-1px}
  button{font:inherit;cursor:pointer;border-radius:8px;padding:10px 16px;
         border:1px solid var(--ink);background:var(--ink);color:#fff}
  button.ghost{background:#fff;color:var(--ink)}
  button:disabled{opacity:.5;cursor:default}
  .err{color:var(--bad);font-size:13px;margin-top:12px;min-height:18px}

  select{font:inherit;padding:8px 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
  .tabs{display:flex;gap:4px;margin:18px 0 16px;border-bottom:1px solid var(--line)}
  .tabs button{background:none;border:none;color:var(--muted);padding:9px 14px;
               border-bottom:2px solid transparent;border-radius:0}
  .tabs button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:600}

  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:14px 16px}
  .card .k{font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
  .card .v{font-size:23px;font-weight:600;color:var(--ink);margin-top:3px;
           font-variant-numeric:tabular-nums}
  .card .s{font-size:12px;color:var(--muted);margin-top:2px}

  table{width:100%;border-collapse:collapse;background:#fff;font-size:14px;
        border:1px solid var(--line);border-radius:10px;overflow:hidden}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;
     color:var(--muted);padding:9px 11px;background:var(--wash);font-weight:600;
     border-bottom:1px solid var(--line)}
  td{padding:9px 11px;border-bottom:1px solid #F0ECE5;vertical-align:top}
  tr:last-child td{border-bottom:none}
  .num{text-align:right;font-variant-numeric:tabular-nums}
  tr.clk{cursor:pointer} tr.clk:hover{background:#FAF8F5}
  tfoot td{font-weight:600;background:var(--wash);border-top:2px solid var(--ink)}

  h3{font-size:15px;margin:24px 0 9px}
  .sub{color:var(--muted);font-size:13px;margin:-4px 0 14px}
  .flag{background:#fff;border:1px solid var(--line);border-left:3px solid var(--warn);
        border-radius:8px;padding:10px 14px;margin-bottom:8px}
  .flag .k{font-weight:600;color:var(--ink);font-size:14px}
  .flag .m{font-size:12.5px;color:var(--muted);margin-top:2px}
  .none{color:var(--muted);font-size:14px;padding:10px 0}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:11.5px;font-weight:600}
  .pill.ok{background:#EEF4EE;color:var(--good)}
  .pill.warn{background:#FDF3E3;color:var(--warn)}
  .pill.bad{background:#FDECEB;color:var(--bad)}
  .note{font-size:12.5px;color:var(--warn);margin-top:3px}
  .day{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:12px;
       overflow:hidden}
  .day h4{margin:0;padding:11px 14px;background:var(--wash);font-size:14px;color:var(--ink);
          display:flex;gap:12px;align-items:center;cursor:pointer}
  .day h4 .sp{flex:1}
  .day .body{padding:0 14px 12px}
  .day table{border:none;border-radius:0}
  @media print{.bar,.tabs,select,button{display:none}}
</style>
</head>
<body>

<div id="login" class="login">
  <h2>Payroll</h2>
  <p>The Quarry &mdash; restricted access</p>
  <label for="em">Email</label>
  <input id="em" type="email" autocomplete="username" placeholder="you@thequarrystl.com">
  <label for="pw">Password</label>
  <input id="pw" type="password" autocomplete="current-password">
  <div class="err" id="loginErr"></div>
  <button id="go" style="width:100%;margin-top:14px">Sign in</button>
</div>

<div id="app" style="display:none">
  <div class="bar">
    <h1>Payroll</h1>
    <select id="week"></select>
    <span id="status"></span>
    <span class="sp"></span>
    <span class="who" id="who"></span>
    <button class="ghost" id="out">Sign out</button>
  </div>
  <div class="wrap">
    <div class="tabs">
      <button data-t="pay" class="on">What to enter</button>
      <button data-t="flags">Before you run</button>
      <button data-t="days">Day by day</button>
      <button data-t="cash">Cash tips</button>
    </div>
    <div id="view"><p class="none">Loading&hellip;</p></div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var API = "https://nkulhtalltbieicvmmad.supabase.co/functions/v1/payroll-panel";
  var tok = null, week = null, tab = "pay", cache = {};

  function $(id){ return document.getElementById(id); }
  function esc(s){ return String(s==null?"":s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  function money(n){ var v=Number(n)||0;
    return "$"+v.toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function dash(n){ return Number(n) ? money(n) : "&mdash;"; }
  function weekLabel(d){
    if(!d) return "";
    try{
      var e=new Date(d+"T12:00:00"), s=new Date(e.getTime()-6*86400000),
          o={month:"short",day:"numeric",timeZone:"America/Chicago"};
      return s.toLocaleDateString("en-US",o)+" – "+e.toLocaleDateString("en-US",o);
    }catch(x){ return d; }
  }
  function niceDate(d){
    if(!d) return "";
    try{ return new Date(d+"T12:00:00").toLocaleDateString("en-US",
      {weekday:"short",month:"short",day:"numeric",timeZone:"America/Chicago"}); }
    catch(x){ return d; }
  }

  function call(op, extra){
    return fetch(API,{method:"POST",
      headers:{"Content-Type":"application/json","x-payroll-token":tok||""},
      body:JSON.stringify(Object.assign({op:op},extra||{}))})
      .then(function(r){ return r.json(); })
      .then(function(j){
        if(j && j.ok===false && /sign in/i.test(j.error||"")) { signOut(); }
        return j;
      });
  }

  /* ---------------------------------------------------------------- login */
  function signIn(){
    var em=$("em").value.trim(), pw=$("pw").value;
    if(!em||!pw){ $("loginErr").textContent="Enter your email and password."; return; }
    $("go").disabled=true; $("loginErr").textContent="";
    fetch(API,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({op:"login",email:em,password:pw})})
      .then(function(r){ return r.json(); })
      .then(function(j){
        $("go").disabled=false;
        if(!j||!j.ok){ $("loginErr").textContent=(j&&j.error)||"Could not sign in."; return; }
        tok=j.token;
        try{ sessionStorage.setItem("qpToken",tok);
             sessionStorage.setItem("qpWho",j.email); }catch(e){}
        start(j.email);
      })
      .catch(function(){ $("go").disabled=false;
        $("loginErr").textContent="Could not reach the server."; });
  }
  function signOut(){
    tok=null;
    try{ sessionStorage.removeItem("qpToken"); sessionStorage.removeItem("qpWho"); }catch(e){}
    $("app").style.display="none"; $("login").style.display="";
    $("pw").value="";
  }

  function start(email){
    $("login").style.display="none"; $("app").style.display="";
    $("who").textContent=email||"";
    call("weeks").then(function(r){
      if(!r||!r.ok||!r.weeks||!r.weeks.length){
        $("view").innerHTML='<p class="none">No weeks found.</p>'; return; }
      $("week").innerHTML=r.weeks.map(function(w){
        var t = w.status==="locked" ? " · locked" : (w.submitted ? " · submitted" : "");
        return '<option value="'+w.week_ending+'">'+weekLabel(w.week_ending)+t+'</option>';
      }).join("");
      load(r.weeks[0].week_ending);
    });
  }

  /* ----------------------------------------------------------------- load */
  function load(wk){
    week=wk; cache={};
    $("view").innerHTML='<p class="none">Loading&hellip;</p>';
    call("week",{week_ending:wk}).then(function(r){
      if(!r||!r.ok){ $("view").innerHTML='<p class="none">Could not load.</p>'; return; }
      cache.week=r.data;
      var d=r.data, badge;
      if(d.status==="locked") badge='<span class="pill">Locked</span>';
      else if(d.submitted)    badge='<span class="pill ok">Submitted</span>';
      else                    badge='<span class="pill warn">Not yet run</span>';
      var h=d.health&&d.health.safe_to_pay
        ? '<span class="pill ok">Reconciled</span>'
        : '<span class="pill bad">Check reconciliation</span>';
      $("status").innerHTML=badge+" "+h;
      render();
    });
  }

  function render(){
    if(tab==="pay")   return renderPay();
    if(tab==="flags") return renderFlags();
    if(tab==="days")  return renderDays();
    if(tab==="cash")  return renderCash();
  }

  /* ------------------------------------------------------------ what to enter */
  function renderPay(){
    var d=cache.week; if(!d) return;
    var t=d.totals||{}, o=[];
    o.push('<p class="sub">Type these into Square Payroll for '+esc(weekLabel(d.week_ending))+
           '. Hours and wages import from timecards; these three columns do not.</p>');
    o.push('<div class="cards">');
    o.push(card("Paycheck tips",money(t.tips)));
    o.push(card("Additional pay",money(t.additional)));
    o.push(card("Tips already paid",money(t.already_paid),"cash — not paid again"));
    o.push(card("Needs a decision",String((d.flags||[]).length)));
    o.push('</div>');

    o.push('<table><thead><tr><th>Name</th><th class="num">Paycheck tips</th>'+
      '<th class="num">Additional pay</th><th class="num">Tips already paid</th>'+
      '<th>Made up of</th></tr></thead><tbody>');
    (d.rows||[]).forEach(function(r,i){
      var p=[];
      if(Number(r.gratuity))   p.push(money(r.gratuity)+" gratuity");
      if(Number(r.bonus))      p.push(money(r.bonus)+" bonus");
      if(Number(r.makeup))     p.push(money(r.makeup)+" wage make-up");
      if(Number(r.adjustment)) p.push(money(r.adjustment)+" correction");
      o.push('<tr class="clk" data-n="'+esc(r.name)+'" data-i="'+i+'">'+
        "<td>"+esc(r.name)+"</td>"+
        '<td class="num">'+dash(r.tips)+"</td>"+
        '<td class="num">'+dash(r.additional)+"</td>"+
        '<td class="num">'+dash(r.already_paid)+"</td>"+
        "<td>"+esc(p.join(" · "))+
          (r.note?'<div class="note">'+esc(r.note)+"</div>":"")+"</td></tr>");
      o.push('<tr id="dr'+i+'" style="display:none"><td colspan="5"></td></tr>');
    });
    o.push('</tbody><tfoot><tr><td>Total</td><td class="num">'+money(t.tips)+
      '</td><td class="num">'+money(t.additional)+'</td><td class="num">'+
      money(t.already_paid)+"</td><td></td></tr></tfoot></table>");

    if(d.owed&&d.owed.length){
      var ot=d.owed.reduce(function(s,x){return s+Number(x.amount||0);},0);
      o.push("<h3>Still owed — "+money(ot)+"</h3>");
      o.push('<p class="sub">Earned but not payable, usually because the person is not set '+
             "up in payroll. Needs an off-cycle run.</p>");
      o.push('<table><thead><tr><th>Name</th><th>Week</th><th class="num">Amount</th>'+
             "<th>Why</th></tr></thead><tbody>");
      d.owed.forEach(function(x){
        o.push("<tr><td>"+esc(x.name)+"</td><td>"+esc(niceDate(x.week))+
          '</td><td class="num">'+money(x.amount)+"</td><td>"+esc(x.reason)+"</td></tr>");
      });
      o.push("</tbody></table>");
    }

    if(d.adjustments&&d.adjustments.length){
      o.push("<h3>Corrections applied</h3>");
      o.push('<p class="sub">Why some figures differ from the raw settlement.</p>');
      o.push('<table><thead><tr><th>Name</th><th>Kind</th><th class="num">Amount</th>'+
             "<th>Reason</th></tr></thead><tbody>");
      d.adjustments.forEach(function(a){
        o.push("<tr><td>"+esc(a.name)+"</td><td>"+esc(a.kind)+'</td><td class="num">'+
          money(a.amount)+"</td><td>"+esc(a.reason)+
          (a.relates_to?" <em>("+esc(niceDate(a.relates_to))+")</em>":"")+"</td></tr>");
      });
      o.push("</tbody></table>");
    }

    $("view").innerHTML=o.join("");
    Array.prototype.forEach.call($("view").querySelectorAll("tr.clk"),function(tr){
      tr.addEventListener("click",function(){ person(tr); });
    });
  }

  function card(k,v,s){
    return '<div class="card"><div class="k">'+esc(k)+'</div><div class="v">'+esc(v)+
           "</div>"+(s?'<div class="s">'+esc(s)+"</div>":"")+"</div>";
  }

  function person(tr){
    var row=$("dr"+tr.getAttribute("data-i")); if(!row) return;
    if(row.style.display!=="none"){ row.style.display="none"; return; }
    row.style.display="";
    var cell=row.firstChild; cell.innerHTML='<p class="none">Loading&hellip;</p>';
    call("person",{week_ending:week,name:tr.getAttribute("data-n")}).then(function(r){
      if(!r||!r.ok){ cell.innerHTML='<p class="none">Could not load.</p>'; return; }
      var p=r.data,w=p.week||{},o=[];
      o.push("<p><b>"+esc(p.name)+"</b> — "+(w.hours||0)+" hrs, "+money(w.wages)+" wages, "+
        money(w.tips)+" tips"+(Number(w.gratuity)?", "+money(w.gratuity)+" gratuity":"")+
        ". True rate "+money(w.true_hourly)+"/hr.</p>");
      if(p.shifts&&p.shifts.length){
        o.push("<table><thead><tr><th>Shift</th><th>Job</th><th>In</th><th>Out</th>"+
          '<th class="num">Hours</th><th class="num">Rate</th></tr></thead><tbody>');
        p.shifts.forEach(function(s){
          o.push("<tr><td>"+esc(niceDate(s.date))+"</td><td>"+esc(s.job)+"</td><td>"+
            esc(s["in"])+"</td><td>"+esc(s.out)+'</td><td class="num">'+s.hours+
            '</td><td class="num">'+money(s.rate)+"</td></tr>");
        });
        o.push("</tbody></table>");
      }
      if(p.nights&&p.nights.length){
        o.push('<table style="margin-top:8px"><thead><tr><th>Night</th><th>Job</th>'+
          '<th class="num">Rang</th><th class="num">Own tips</th>'+
          '<th class="num">Tipped out</th><th class="num">Received</th>'+
          '<th class="num">Net</th></tr></thead><tbody>');
        p.nights.forEach(function(n){
          o.push("<tr><td>"+esc(niceDate(n.date))+"</td><td>"+esc(n.job)+
            '</td><td class="num">'+money(n.rang)+'</td><td class="num">'+money(n.own_tips)+
            '</td><td class="num">'+(Number(n.paid_out)?"-"+money(n.paid_out):"&mdash;")+
            '</td><td class="num">'+dash(n.received)+'</td><td class="num">'+
            money(n.net)+"</td></tr>");
        });
        o.push("</tbody></table>");
      }
      cell.innerHTML=o.join("");
    });
  }

  /* ---------------------------------------------------------------- flags */
  function renderFlags(){
    var d=cache.week; if(!d) return;
    var o=[];
    o.push("<h3>Before you run</h3>");
    if(!d.flags||!d.flags.length){
      o.push('<p class="none">Nothing flagged. Every gratuity check, timecard and job '+
             "code looks consistent.</p>");
    } else {
      o.push('<p class="sub">'+d.flags.length+" item"+(d.flags.length===1?"":"s")+
             " worth a look before submitting.</p>");
      d.flags.forEach(function(f){
        o.push('<div class="flag"><div class="k">'+esc(f.kind)+"</div>"+
          '<div class="m">'+esc(niceDate(f.on_date))+" · "+esc(f.detail||"")+
          " — "+esc(f.note||"")+"</div></div>");
      });
    }
    $("view").innerHTML=o.join("");
  }

  /* ------------------------------------------------------------- day by day */
  function renderDays(){
    if(cache.days) return paintDays();
    $("view").innerHTML='<p class="none">Loading&hellip;</p>';
    call("days",{week_ending:week}).then(function(r){
      if(!r||!r.ok){ $("view").innerHTML='<p class="none">Could not load.</p>'; return; }
      cache.days=r.days||[]; paintDays();
    });
  }
  function paintDays(){
    var o=[];
    cache.days.forEach(function(d,i){
      var pill = d.reconciled==="ok" ? '<span class="pill ok">ok</span>'
               : d.reconciled==="warn" ? '<span class="pill warn">warn</span>'
               : d.reconciled==="fail" ? '<span class="pill bad">fail</span>'
               : '<span class="pill">'+esc(d.reconciled)+"</span>";
      o.push('<div class="day"><h4 data-d="'+i+'">'+esc(d.day)+
        '<span class="sp"></span>'+d.checks+" checks · "+money(d.net_sales)+" sales · "+
        money(d.card_tips)+" tips"+(Number(d.gratuity)?" · "+money(d.gratuity)+" grat":"")+
        " · "+d.hours+" hrs "+pill+"</h4>"+
        '<div class="body" id="db'+i+'" style="display:none"></div></div>');
    });
    $("view").innerHTML=o.join("");
    Array.prototype.forEach.call($("view").querySelectorAll(".day h4"),function(h){
      h.addEventListener("click",function(){
        var i=h.getAttribute("data-d"), b=$("db"+i);
        if(b.style.display!=="none"){ b.style.display="none"; return; }
        b.style.display=""; b.innerHTML=dayBody(cache.days[i]);
      });
    });
  }
  function dayBody(d){
    if(!d.staff||!d.staff.length) return '<p class="none">Nobody clocked in.</p>';
    var o=['<table><thead><tr><th>Name</th><th>Job</th><th>In</th><th>Out</th>'+
      '<th class="num">Hours</th><th class="num">Rang</th><th class="num">Own tips</th>'+
      '<th class="num">Out</th><th class="num">In</th><th class="num">Net</th>'+
      "</tr></thead><tbody>"];
    d.staff.forEach(function(s){
      o.push("<tr><td>"+esc(s.name)+"</td><td>"+esc(s.job)+"</td><td>"+esc(s["in"])+
        "</td><td>"+esc(s.out)+'</td><td class="num">'+s.hours+
        '</td><td class="num">'+dash(s.rang)+'</td><td class="num">'+dash(s.own_tips)+
        '</td><td class="num">'+(Number(s.paid_out)?"-"+money(s.paid_out):"&mdash;")+
        '</td><td class="num">'+dash(s.received)+'</td><td class="num">'+
        dash(s.net_tips)+"</td></tr>");
    });
    o.push('</tbody><tfoot><tr><td colspan="4">Total</td><td class="num">'+d.hours+
      '</td><td class="num">'+money(d.net_sales)+'</td><td class="num">'+
      money(d.card_tips)+'</td><td></td><td></td><td class="num">'+
      money(d.wages)+" wages</td></tr></tfoot></table>");
    return o.join("");
  }

  /* ----------------------------------------------------------------- cash */
  function renderCash(){
    if(cache.cash) return paintCash();
    $("view").innerHTML='<p class="none">Loading&hellip;</p>';
    call("cash",{week_ending:week}).then(function(r){
      if(!r||!r.ok){ $("view").innerHTML='<p class="none">Could not load.</p>'; return; }
      cache.cash=r.cash; paintCash();
    });
  }
  function paintCash(){
    var c=cache.cash||{}, o=[];
    o.push('<div class="cards">');
    o.push(card("Cash taken",money(c.cash_sales)));
    o.push(card("Declared as tips",money(c.declared)));
    o.push(card("Percentage",(c.pct==null?"—":c.pct+"%"),
      "IRS allocation threshold is 8%"));
    o.push("</div>");
    o.push(c.below_threshold
      ? '<div class="flag"><div class="k">Below the 8% threshold</div><div class="m">'+
        "Shortfall "+money(c.shortfall)+". Under IRS rules (Form 8027) the difference "+
        "would be allocated across tipped staff.</div></div>"
      : '<p class="sub">Above the 8% threshold, so no allocation obligation this week.</p>');

    var nb=c.nobody_declared||[];
    o.push("<h3>Handled $50 or more in cash and declared nothing</h3>");
    if(!nb.length){ o.push('<p class="none">Nobody — everyone handling cash declared some.</p>'); }
    else{
      o.push('<p class="sub">Worth a quiet word rather than an assumption. Cash tips are '+
             "theirs either way; declaring keeps their W-2 right.</p>");
      o.push('<table><thead><tr><th>Date</th><th>Name</th>'+
             '<th class="num">Cash handled</th></tr></thead><tbody>');
      nb.forEach(function(x){
        o.push("<tr><td>"+esc(niceDate(x.date))+"</td><td>"+esc(x.name)+
          '</td><td class="num">'+money(x.cash_handled)+"</td></tr>");
      });
      o.push("</tbody></table>");
    }
    $("view").innerHTML=o.join("");
  }

  /* ----------------------------------------------------------------- wire */
  $("go").addEventListener("click",signIn);
  $("pw").addEventListener("keydown",function(e){ if(e.key==="Enter") signIn(); });
  $("em").addEventListener("keydown",function(e){ if(e.key==="Enter") $("pw").focus(); });
  $("out").addEventListener("click",signOut);
  $("week").addEventListener("change",function(e){ load(e.target.value); });
  Array.prototype.forEach.call(document.querySelectorAll(".tabs button"),function(b){
    b.addEventListener("click",function(){
      Array.prototype.forEach.call(document.querySelectorAll(".tabs button"),function(x){
