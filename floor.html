<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Floor &middot; The Quarry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --charcoal:#1A1A1A; --brown-dark:#2C1A0E; --cream:#F5F0E8; --gold:#B8933A; --gold-light:#D4AF6A;
  --green:#4CAF50; --gray:#9A9A9A; --panel:#221a13; --panel-2:#2b2019; --line:rgba(212,175,106,.18);
  --paid:#5b86ad; --food:#ff8a3d; --drinks:#3dc2ff; --red:#8B2E2E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;height:100%}
body{background:var(--charcoal);color:var(--cream);font-family:Montserrat,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
button{font-family:inherit}

/* embedded inside the checklist's Host & Bus board: no second title bar */
.embed header h1,.embed header .tvname,.embed header a.hbtn{display:none}
.embed header{height:52px;padding:0 6px;border-bottom:none;background:none}
.embed #bar{padding:6px 6px}
.embed body.ctl main,.embed.ctl main{height:calc(100vh - 52px - 56px)}
.embed main{padding:8px 6px}
/* header */
header{height:58px;display:flex;align-items:center;gap:14px;padding:0 18px;border-bottom:1px solid var(--line);background:linear-gradient(180deg,#1A1A1A 70%,rgba(26,26,26,.96))}
header h1{font-family:'Playfair Display',Georgia,serif;font-size:20px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-light);margin:0;white-space:nowrap}
header .tvname{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--gray);white-space:nowrap}
header .sp{flex:1}
.clock{font-size:22px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.pill{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;padding:5px 11px;border-radius:999px;background:rgba(245,240,232,.08);color:#c8bba6;white-space:nowrap}
.pill.auto{background:rgba(76,175,80,.18);color:#8fd694}
.pill.manual{background:rgba(255,138,61,.16);color:#ffb27a}
.hbtn{background:transparent;border:1px solid var(--line);color:var(--gold-light);border-radius:999px;padding:8px 15px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer;white-space:nowrap}
.hbtn.on{background:var(--gold);color:#1A1A1A;border-color:var(--gold)}
.hbtn.clr{background:#b3261e;color:#fff;border-color:#ff8f87}
.clrrow{display:flex;align-items:center;gap:14px;padding:12px 0;border-top:1px solid rgba(245,240,232,.08)}
.clrrow .big{font-size:30px;font-weight:800;min-width:64px}
.clrrow .who{flex:1;min-width:0}
.clrrow .who b{display:block;font-size:15px}
.clrrow .who span{font-size:12px;color:#b6a894}
.clrrow .btn{flex:0 0 auto;min-width:130px;padding:14px 16px}

/* chips row (control mode) */
#bar{display:none;gap:8px;padding:10px 18px;border-bottom:1px solid var(--line);overflow-x:auto;align-items:center}
.chip{flex:0 0 auto;background:rgba(245,240,232,.07);border:1px solid var(--line);color:var(--cream);border-radius:10px;padding:10px 15px;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--gold);color:#1A1A1A;border-color:var(--gold)}
.hint{font-size:11px;color:var(--gray);letter-spacing:.06em;text-transform:uppercase;margin-left:6px;white-space:nowrap}

/* board */
main{display:flex;gap:16px;padding:12px 18px 12px;height:calc(100vh - 58px)}
body.ctl main{height:calc(100vh - 58px - 58px)}
#boardwrap{flex:1;display:flex;flex-wrap:wrap;gap:16px;justify-content:center;align-items:flex-start;align-content:flex-start;min-width:0;overflow:auto}
.chart{flex:0 0 auto}
.chart h2{margin:0 0 10px;height:28px;display:flex;align-items:center;gap:10px;font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold-light);font-weight:800;white-space:nowrap}
.chart h2 .pl{font-size:11px;letter-spacing:.03em;text-transform:none;font-weight:700;padding:3px 10px;border-radius:999px;background:rgba(245,240,232,.08);color:#d8cdb9}
.chart h2 .pl.seat{background:rgba(212,175,106,.18);color:var(--gold-light)} .chart h2 .pl.clr{background:rgba(255,107,97,.2);color:#ffa39c}
.sq{position:relative;border-radius:20px;overflow:hidden;border:1px solid rgba(212,175,106,.22);
  background:radial-gradient(120% 90% at 50% 0%,#2a2018 0%,#1d1611 60%,#17110d 100%);
  box-shadow:inset 0 0 70px rgba(0,0,0,.45),0 14px 34px rgba(0,0,0,.4)}
.sq:before{content:'';position:absolute;left:0;top:0;right:0;bottom:0;background-image:radial-gradient(rgba(212,175,106,.12) 1px,transparent 1.3px);background-size:calc(var(--u)*5) calc(var(--u)*5);opacity:.55;pointer-events:none}
.tbl{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;text-align:center;cursor:pointer;color:#f3ede2;user-select:none;font-size:calc(var(--u)*var(--fs,4.3))}
.tbl .bg{position:absolute;left:0;top:0;right:0;bottom:0;z-index:0;border-radius:calc(var(--u)*1.4);border:calc(var(--u)*.3) solid rgba(110,200,120,.55);
  background:linear-gradient(160deg,rgba(76,175,80,.17),rgba(76,175,80,.06));box-shadow:0 calc(var(--u)*.5) calc(var(--u)*1.3) rgba(0,0,0,.45)}
.tbl.round .bg{border-radius:50%}
.tbl .n{position:relative;z-index:1;font-weight:800;font-size:1em;letter-spacing:-.01em;text-shadow:0 1px 2px rgba(0,0,0,.4)}
.tbl .s{position:relative;z-index:1;font-weight:800;font-size:.48em;letter-spacing:.05em;text-transform:uppercase;margin-top:.28em;white-space:nowrap;opacity:.96}
.tbl.occupied{color:#1d1409}.tbl.occupied .bg{background:linear-gradient(160deg,#e6c677,#b8933a);border-color:#f2d99a}.tbl.occupied .n{text-shadow:none}
.tbl.paid{color:#fff}.tbl.paid .bg{background:linear-gradient(160deg,#6c9bc4,#4a76a0);border-color:#9bc0e0}
.tbl.closed{color:#fff}.tbl.closed .bg{background:linear-gradient(160deg,#dc4a40,#a52620);border-color:#ff8f87}
.tbl.ready{color:#fff}.tbl.ready .bg{background:linear-gradient(160deg,#52c258,#2e8b34);border-color:#a0e6a4}
.tbl.stg-seated{color:#2a2113}.tbl.stg-seated .bg{background:linear-gradient(160deg,#fcf7e8,#e6dbbb);border-color:#fff3c9}.tbl.stg-seated .n{text-shadow:none}
.tbl.stg-drinks{color:#fff}.tbl.stg-drinks .bg{background:linear-gradient(160deg,#ab86e8,#7650c2);border-color:#d3bdf7}
.tbl.stg-food{color:#1d1409}.tbl.stg-food .bg{background:linear-gradient(160deg,#e6c677,#b8933a);border-color:#f2d99a}.tbl.stg-food .n{text-shadow:none}
.tbl.stg-ordered{color:#1d1409}.tbl.stg-ordered .bg{background:linear-gradient(160deg,#e6c677,#b8933a);border-color:#f2d99a}.tbl.stg-ordered .n{text-shadow:none}
.tbl.wait .bg{animation:ringy 1.6s infinite}
.tbl.callfood .bg{border-color:#ff8a3d;border-width:calc(var(--u)*.7);animation:ringo 1.2s infinite}
.tbl.calldrinks .bg{border-color:#3dc2ff;border-width:calc(var(--u)*.7);animation:ringb 1.2s infinite}
.tbl.callfood.calldrinks .bg{border-color:#ff8a3d;animation:ringo 1.2s infinite}
@keyframes ringo{0%,100%{box-shadow:0 calc(var(--u)*.5) calc(var(--u)*1.3) rgba(0,0,0,.45)}50%{box-shadow:0 0 0 calc(var(--u)*1.4) rgba(255,138,61,.6)}}
@keyframes ringb{0%,100%{box-shadow:0 calc(var(--u)*.5) calc(var(--u)*1.3) rgba(0,0,0,.45)}50%{box-shadow:0 0 0 calc(var(--u)*1.4) rgba(61,194,255,.6)}}
@keyframes ringy{0%,100%{box-shadow:0 calc(var(--u)*.5) calc(var(--u)*1.3) rgba(0,0,0,.45)}50%{box-shadow:0 0 0 calc(var(--u)*1.1) rgba(255,224,102,.65)}}
.legend i.ring{background:transparent;border:2px solid #ff8a3d;border-radius:50%}
.tbl.edit{cursor:grab;touch-action:none}
.tbl.edit.sel .bg{outline:3px solid #fff}

/* run list */
#side{width:min(24vw,360px);flex:0 0 auto;display:flex;flex-direction:column;gap:16px;overflow:auto;min-height:0}
#runlist{width:auto;display:none}
#resvpanel{display:none}
#resvpanel h3{margin:4px 0 10px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800;display:flex;justify-content:space-between;align-items:baseline}
#resvpanel h3 small{font-size:11px;letter-spacing:.04em;text-transform:none;color:var(--gray);font-weight:600}
.rv{display:flex;gap:12px;background:var(--panel);border:1px solid var(--line);border-left:5px solid rgba(245,240,232,.18);border-radius:12px;padding:9px 12px;margin-bottom:8px}
.rv.soon{border-left-color:var(--gold)} .rv.now{border-left-color:var(--green)} .rv.past{opacity:.5}
.rv .t{min-width:62px;font-weight:800;font-size:15px;color:var(--gold-light)}
.rv .b{flex:1;min-width:0}
.rv .nm{font-weight:700;font-size:14px;line-height:1.25}
.rv .d{font-size:11.5px;color:#b6a894;margin-top:3px;line-height:1.35}
.rk{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:2px 8px;border-radius:999px;margin-right:6px}
.rk.golf{background:rgba(76,175,80,.22);color:#8fd694}.rk.party{background:rgba(155,107,214,.25);color:#cdb0f4}.rk.res{background:rgba(245,240,232,.13);color:#e6dcc4}.rk.wed{background:rgba(212,175,106,.25);color:#e8cb86}.rk.pav{background:rgba(61,194,255,.2);color:#92d9ff}
#runlist h3{margin:4px 0 10px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--gold);font-weight:800}
.run{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--food);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.run.drinks{border-left-color:var(--drinks)} .run.ready{border-left-color:var(--green)}
.run .big{font-size:30px;font-weight:800;min-width:56px;letter-spacing:-.01em}
.run .who{flex:1;min-width:0}
.run .k{font-size:12px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}
.run .k.food{color:var(--food)} .run .k.drinks{color:var(--drinks)} .run .k.ready{color:var(--green)}
.run .a{font-size:11.5px;color:var(--gray);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.run .m{font-size:12px;color:var(--gray);font-weight:700}
body.narrow main{flex-direction:column}
body.narrow #side{width:100%;order:-1;flex:0 0 auto}
body.narrow #resvpanel{max-height:34vh;overflow:auto}
body.narrow main{overflow:hidden}
body.scrollmode main{overflow:auto}
body.scrollmode #boardwrap{flex:none;overflow:visible}
#boardwrap{align-content:center}
body.scrollmode #boardwrap{align-content:flex-start}
#boardwrap{min-height:0}
@media(max-width:900px){.chart h2{white-space:normal;flex-wrap:wrap;height:auto;gap:6px 8px;font-size:13px}header{padding:0 10px;gap:8px;flex-wrap:wrap;height:auto;min-height:52px}.legend{flex-wrap:wrap;gap:6px 10px}}

/* legend (TV) */
.legend{display:flex;gap:14px;align-items:center;font-size:12px;color:#c8bba6;white-space:nowrap}
.legend i{display:inline-block;width:13px;height:13px;border-radius:4px;margin-right:6px;vertical-align:-2px}
/* TV screens: wrapped titles, a big colour key along the bottom, no words that can't fit inside a tile */
#tvlegend{display:none}
body.tv header{height:58px;min-height:58px;flex-wrap:nowrap;padding:0 18px;gap:14px}
body.tv #tvlegend{display:flex;position:fixed;left:0;right:0;bottom:0;height:48px;gap:6px 24px;align-items:center;justify-content:center;flex-wrap:wrap;padding:0 14px;background:#120e0a;border-top:1px solid var(--line);font-size:16px;font-weight:600;color:#ece3d0;z-index:5}
#tvlegend span{display:inline-flex;align-items:center;white-space:nowrap}
#tvlegend i{display:inline-block;width:20px;height:20px;border-radius:6px;margin-right:9px;border:2px solid transparent}
#tvlegend i.ring{background:transparent;border-radius:50%}
body.tv main{height:calc(100vh - 58px - 48px)}
body.tv .chart h2{height:auto;min-height:44px;flex-wrap:wrap;align-content:flex-start;gap:4px 8px;white-space:normal;font-size:14px;letter-spacing:.14em;line-height:1.15}
body.tv .chart h2 .pl{font-size:11px;padding:2px 8px}
.tiny .tbl .s{display:none}

/* sheet / modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.72);z-index:60;display:none}
.scrim.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:61;background:var(--brown-dark);border-top:1px solid var(--gold);border-radius:22px 22px 0 0;padding:22px 20px calc(22px + env(safe-area-inset-bottom));transform:translateY(100%);transition:transform .22s ease,visibility 0s linear .22s;max-height:90vh;overflow-y:auto}
.sheet{visibility:hidden}
.sheet.on{transform:translateY(0);visibility:visible;transition:transform .22s ease,visibility 0s}
@media(min-width:760px){.sheet{max-width:640px;margin:0 auto;border-radius:22px;bottom:24px;left:24px;right:24px}}
.sheet h3{margin:0 0 4px;font-size:21px;font-weight:800}
.sheet .sub{color:#b6a894;font-size:13px;margin-bottom:14px;line-height:1.5}
.dchips{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0 6px;align-items:center}
.dchips button,.dchips input{font-family:inherit;padding:9px 14px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--gold-light);font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;cursor:pointer}
.dchips button.on{background:var(--gold);border-color:var(--gold);color:#1A1A1A}
.dchips input{color-scheme:dark;text-transform:none;letter-spacing:0}
.dayh{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:800;margin:22px 0 2px;display:flex;justify-content:space-between}
.dayh small{color:var(--gray);font-weight:600;letter-spacing:.04em;text-transform:none}
.lbl{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);font-weight:700;margin:16px 0 9px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.acts{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.btn{flex:1;min-width:120px;border:none;border-radius:12px;padding:16px;font-size:15px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;color:#1A1A1A;background:var(--gold)}
.btn.food{background:var(--food)} .btn.drinks{background:var(--drinks)} .btn.green{background:var(--green)}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--gray);flex:0 0 auto;padding:16px 20px}
.btn.danger{background:var(--red);color:#fff}
.btn:disabled{opacity:.45}
input[type=text],input[type=password],select{width:100%;background:rgba(0,0,0,.3);border:1px solid var(--line);color:var(--cream);border-radius:10px;padding:13px 14px;font-size:16px;font-family:inherit;margin-top:4px}
select option{background:#221a13;color:#F5F0E8}
.item{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid rgba(245,240,232,.07);font-size:14px}
.item b{color:var(--gold-light)}
.resv{display:flex;gap:12px;padding:12px 0;border-top:1px solid rgba(245,240,232,.07)}
.resv .t{min-width:74px;font-weight:800;font-size:16px;color:var(--gold-light)}
.resv .b{flex:1;min-width:0}
.resv .nm{font-weight:700;font-size:15px}
.resv .d{font-size:12px;color:#b6a894;margin-top:3px}
.tvrow{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px}
.tvrow .top{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-bottom:8px}
.tvrow .nm{font-weight:800;font-size:15px}
.tvrow .url{font-size:11px;color:var(--gray);word-break:break-all;margin-top:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%) translateY(120%);bottom:26px;z-index:90;background:var(--gold);color:#1A1A1A;padding:13px 22px;border-radius:999px;font-weight:700;font-size:14px;transition:transform .25s ease,opacity .25s ease;opacity:0;pointer-events:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1}
.msg{display:flex;align-items:center;justify-content:center;height:60vh;color:var(--gray);font-size:18px;text-align:center;padding:0 24px;line-height:1.5}
</style>
</head>
<body>
<header id="hdr"></header>
<div id="bar"></div>
<main><div id="boardwrap"></div><div id="side"><aside id="runlist"></aside><aside id="resvpanel"></aside></div></main>
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ==================================================================
   THE QUARRY - FLOOR BOARD
   ?tv=expo        TV display (follows the screen set up in Setup, read-only)
   ?tv=expo&areas=inside,back_patio   TV display with the charts forced
   (no params)     control mode for host / expo iPads
   ================================================================== */
var FN = 'https://nkulhtalltbieicvmmad.supabase.co/functions/v1/floor-api';
var KEY = 'sb_publishable_FQK59Bn8P2jV8yGL0nPi7w_jVHFMBSl';
var QS = new URLSearchParams(location.search);
var TV = (QS.get('tv') || '').toLowerCase();
var FORCE = (QS.get('areas') || '').split(',').filter(Boolean);
var DISPLAY = !!TV;
var EMBED = QS.get('embed') === '1';
var RO = QS.get('ro') === '1';           // read-only view for every other role: look, don't touch
if (EMBED) document.documentElement.className += ' embed';
var ONLY = QS.get('only') === 'reservations';
var S = null;                 // last state from the server
var sel = [];                 // control mode: charts being shown (max 3)
var token = null;             // setup session
var editArea = null, editTables = null, editSel = null;  // layout editor
var timer = null;

function $(s){ return document.querySelector(s); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }
function store(k, v){ try { if (v !== undefined) { if (v === null) sessionStorage.removeItem(k); else sessionStorage.setItem(k, v); } return sessionStorage.getItem(k); } catch(e){ return null; } }
function lstore(k, v){ try { if (v !== undefined) localStorage.setItem(k, v); return localStorage.getItem(k); } catch(e){ return null; } }
function toast(m){ var t = $('#toast'); t.textContent = m; t.classList.add('on'); clearTimeout(toast._t); toast._t = setTimeout(function(){ t.classList.remove('on'); }, 2400); }

function api(action, body){
  return fetch(FN + '?action=' + action, { method:'POST', headers:{ apikey:KEY, 'Content-Type':'application/json' }, body: JSON.stringify(body || {}) })
    .then(function(r){ return r.json().then(function(d){ return { ok:r.ok, status:r.status, data:d }; }).catch(function(){ return { ok:false, status:r.status, data:{} }; }); });
}

/* ---------------- published changes: reload when an admin publishes or presses Refresh ---------------- */
var seenNonce = null;
function checkNonce(){
  var c = (S.tvs || []).filter(function(t){ return t.tv === TV; })[0]; if (!c) return;
  var n = c.refresh_nonce || 0;
  if (seenNonce === null) seenNonce = n; else if (n !== seenNonce) location.reload();
}

/* ---------------- data ---------------- */
function load(){
  return api('state').then(function(r){
    if (!r.ok) throw new Error('state');
    S = r.data; if (DISPLAY) checkNonce(); render();
  }).catch(function(){ var p = $('#hdr .pill.sync'); if (p){ p.className = 'pill sync manual'; p.textContent = 'Offline - retrying'; } });
}
function closedList(){ return (S.states || []).filter(function(x){ return x.status === 'closed' || x.status === 'paid'; }).sort(function(a, b){ return new Date(a.paid_at || a.seated_at || 0) - new Date(b.paid_at || b.seated_at || 0); }); }
function nClear(){ return S ? closedList().length : 0; }
function toClearSheet(){
  var list = closedList();
  if (!list.length){ closeSheet(); toast('Nothing to clear'); return; }
  openSheet('<h3>Tables to clear</h3><div class="sub">These tables have paid and left. Check each one, then tap <b>Mark open</b> when it\'s ready for the next party.</div>' +
    list.map(function(x){ var a = areaByKey(x.area_key), m = mins(x.paid_at || x.seated_at);
      return '<div class="clrrow"><span class="big">' + esc(x.table_num) + '</span><span class="who"><b>' + esc(a ? a.label : '') + '</b><span>' + (m == null ? 'closed out' : 'closed out ' + m + ' min ago') + '</span></span>' +
        '<button class="btn green" data-a="openfromlist" data-area="' + esc(x.area_key) + '" data-t="' + esc(x.table_num) + '">Mark open</button></div>'; }).join('') +
    '<div class="acts"><button class="btn ghost" data-a="close" style="flex:1">Close</button></div>');
}
function areaByKey(k){ return (S.areas || []).filter(function(a){ return a.key === k; })[0]; }

function stageOf(st){
  if (!st || st.status !== 'occupied') return '';
  return (st.ticket && st.ticket.stage) ? st.ticket.stage : 'seated';     // host tapped it (no ticket yet) = seated
}
var STAGE_WORD = { seated: 'Seated', drinks: 'Drinks', food: 'Food', ordered: 'Ordered' };
function tileHtml(t, st, calls, tilePct, editing){
  var food = calls.filter(function(c){ return c.kind === 'food'; })[0], drinks = calls.filter(function(c){ return c.kind === 'drinks'; })[0];
  var ready = !!(st && st.status === 'occupied' && st.ticket && st.ticket.ready);
  var stage = stageOf(st), m = st ? mins(st.seated_at) : null;
  var cls = 'tbl' + (t.shape === 'round' ? ' round' : '') + (st ? ' ' + st.status : '') + (stage ? ' stg-' + stage : '') + (ready && !food && !drinks ? ' ready' : '');
  if (stage === 'seated' && m != null && m >= 6) cls += ' wait';             // seated a while with no order yet
  if (food) cls += ' callfood'; if (drinks) cls += ' calldrinks';
  if (editing){ cls += ' edit'; if (editSel === t.table_num) cls += ' sel'; }
  var w = t.w ? Number(t.w) : tilePct, h = t.h ? Number(t.h) : tilePct;
  // one short status line, drawn inside the table (never outside it, so it can't land on a neighbour)
  var sub = '';
  var up = (w >= 9) ? ' up' : '';          // small tables only have room for the short word; the pulsing ring says a runner is needed
  if (food && drinks) sub = (w >= 9) ? 'Food + drinks up' : 'Both'; else if (food) sub = 'Food' + up; else if (drinks) sub = 'Drinks' + up;
  else if (st && st.status === 'closed') sub = 'Closed';
  else if (st && st.status === 'paid') sub = 'Paid';
  else if (ready) sub = 'Ready';
  else if (stage) sub = (w >= 7.5) ? STAGE_WORD[stage] + (m != null ? ' ' + m + 'm' : '') : (m != null ? m + 'm' : '');
  if (Math.min(w, h) < 5.2) sub = '';          // tiny seats (bar stools): colour only
  var fs = Math.max(1.9, Math.min(Math.min(w, h) * 0.5, 4.4));
  var rot = Number(t.rot) || 0;
  return '<div class="' + cls + '" data-t="' + esc(t.table_num) + '" style="left:' + t.x + '%;top:' + t.y + '%;width:calc(var(--u)*' + w + ');height:calc(var(--u)*' + h + ');--fs:' + fs.toFixed(2) + '">' +
    '<i class="bg"' + (rot ? ' style="transform:rotate(' + rot + 'deg)"' : '') + '></i>' +
    '<span class="n">' + esc(t.table_num) + '</span>' + (sub ? '<span class="s">' + esc(sub) + '</span>' : '') + '</div>';
}
function chartHtml(a){
  var tables = (editArea === a.key && editTables) ? editTables : (S.tables || []).filter(function(t){ return t.area_key === a.key; });
  var occ = 0, free = 0, clr = 0;
  tables.forEach(function(t){ var st = stateOf(a.key, t.table_num); if (st && st.status === 'occupied') occ++; else if (st && (st.status === 'closed' || st.status === 'paid')) clr++; else free++; });
  // tile size adapts to how tightly this chart's tables are packed (bar stools sit closer than dining tables)
  var tilePct = tables.length > 20 ? 11.5 : 13;
  if (tables.length > 1){
    var md = 999;
    for (var i = 0; i < tables.length; i++) for (var j = i + 1; j < tables.length; j++){
      var dd = Math.sqrt(Math.pow(tables[i].x - tables[j].x, 2) + Math.pow(tables[i].y - tables[j].y, 2)); if (dd < md) md = dd;
    }
    tilePct = Math.max(6, Math.min(tilePct, md * 0.94));
  }
  return '<div class="chart" data-area="' + esc(a.key) + '"><h2>' + esc(a.label) + '<span class="pl">' + free + ' open</span>' + (occ ? '<span class="pl seat">' + occ + ' seated</span>' : '') + (clr ? '<span class="pl clr">' + clr + ' to clear</span>' : '') + '</h2><div class="sq">' +
    tables.map(function(t){ return tileHtml(t, stateOf(a.key, t.table_num), callsOf(a.key, t.table_num), tilePct, !!editArea); }).join('') + '</div></div>';
}
function runEntries(){
  var out = [];
  (S.calls || []).forEach(function(c){ out.push({ kind: c.kind, area: c.area_key, num: c.table_num, since: c.created_at }); });
  (S.states || []).forEach(function(s){
    if (s.ticket && s.ticket.ready && s.status === 'occupied' && !(S.calls || []).some(function(c){ return c.area_key === s.area_key && c.table_num === s.table_num && c.kind === 'food'; }))
      out.push({ kind:'ready', area: s.area_key, num: s.table_num, since: s.seated_at });
  });
  out.sort(function(a, b){ return new Date(a.since) - new Date(b.since); });
  return out;
}
function renderRunList(){
  var rl = $('#runlist'), list = runEntries();
  if (!list.length || editArea){ rl.style.display = 'none'; return; }
  rl.style.display = 'block';
  rl.innerHTML = '<h3>Run list</h3>' + list.map(function(e){

    return '<div class="run ' + e.kind + '" data-a="run" data-area="' + esc(e.area) + '" data-t="' + esc(e.num) + '"><span class="big">' + esc(e.num) + '</span><span class="who"><div class="k ' + e.kind + '">' +
      (e.kind === 'food' ? 'Food' : e.kind === 'drinks' ? 'Drinks' : 'Kitchen ready') + '</div><div class="a">' + esc(a ? a.label : '') + '</div></span><span class="m">' + (m == null ? '' : m + 'm') + '</span></div>';
  }).join('');
}
function render(){
  if (!S) return;
  renderHeader(); renderBar();
  var wrap = $('#boardwrap'), areas = shownAreas();
  if (areas === null){ wrap.innerHTML = '<div class="msg">This screen (' + esc(TV) + ') isn\'t set up yet.<br>A manager can pick its floor charts in Setup on the host iPad.</div>'; $('#runlist').style.display = 'none'; return; }
  if (!areas.length){ wrap.innerHTML = '<div class="msg">' + (DISPLAY ? 'No charts selected for this screen.' : 'Tap a chart above to show it.') + '</div>'; renderRunList(); return; }
  wrap.innerHTML = areas.map(chartHtml).join('');
  renderRunList(); renderResv(); sizeBoard();
}
function sizeBoard(){
  var wrap = $('#boardwrap'), charts = wrap.querySelectorAll('.chart'), n = charts.length; if (!n) return;
  document.body.classList.toggle('narrow', !DISPLAY && window.innerWidth < 900);
  var sd = $('#side'), rlv = $('#runlist'), rsv = $('#resvpanel');
  if (sd) sd.style.display = ((rlv && rlv.style.display !== 'none' && rlv.innerHTML) || (rsv && rsv.style.display !== 'none' && rsv.innerHTML)) ? '' : 'none';
  // Fit every chart on one screen: try each column count, keep the arrangement that gives the biggest charts.
  document.body.classList.remove('scrollmode'); wrap.style.height = '';
  var gap = 16, W = wrap.clientWidth, top = wrap.getBoundingClientRect().top;
  var H = Math.max(160, window.innerHeight - top - 12 - (DISPLAY ? 48 : 0));
  function hdrFor(s){ return (s < 420 ? 44 : 28) + 10; }      // title + count pills (they wrap on small charts)
  var opts = [];
  for (var c = 1; c <= n; c++){
    var r = Math.ceil(n / c), sw = (W - gap * (c - 1) - 2) / c, rowH = (H - gap * (r - 1)) / r;
    var s0 = Math.floor(Math.min(sw, rowH - hdrFor(9999)));          // roomy title row first ...
    if (s0 < 420) s0 = Math.floor(Math.min(sw, rowH - hdrFor(0)));   // ... charts under 420px get the taller, wrapped title row
    opts.push({ c: c, r: r, s: s0 });
  }
  var top1 = Math.max.apply(null, opts.map(function(o){ return o.s; }));
  var best = opts.filter(function(o){ return o.s >= top1 * 0.9; }).sort(function(a, b){ return a.r - b.r || b.s - a.s; })[0];   // near-ties: fewer rows reads as one diagram
  var side = best.s, scroll = false;
  if (side < 200 && W < 700){ side = Math.floor(W); scroll = true; }     // phone: stack and scroll instead of tiny charts
  side = Math.max(120, side);
  document.body.classList.toggle('scrollmode', scroll);
  if (!scroll) wrap.style.height = H + 'px';
  wrap.classList.toggle('tiny', side < 400);
  var hh = hdrFor(side) - 10;
  for (var i = 0; i < charts.length; i++){
    charts[i].style.width = side + 'px';
    var h2 = charts[i].querySelector('h2'); if (h2) h2.style.minHeight = hh + 'px';
    var sq = charts[i].querySelector('.sq'); sq.style.width = side + 'px'; sq.style.height = side + 'px';
    charts[i].style.setProperty('--u', (side / 100) + 'px');
  }
}

});
document.addEventListener('pointerup', function(){
  if (!drag) return;
  var d = drag; drag = null;
  var row = editTables.filter(function(t){ return t.table_num === d.num; })[0];
  if (d.moved && row){ row.x = d.x; row.y = d.y; }
  editSel = d.num; document.querySelectorAll('.tbl.edit').forEach(function(el){ el.classList.toggle('sel', el.getAttribute('data-t') === d.num); });
});

/* ---------------- clicks ---------------- */
document.addEventListener('click', function(e){
  var el = e.target.closest('[data-a]');
  if (!el){
    var tb = e.target.closest('.tbl');
    if (tb && !DISPLAY && !editArea && !RO){
      var ar = tb.closest('.chart').getAttribute('data-area'), nm = tb.getAttribute('data-t');
      if (tb.classList.contains('closed')){
        // a red (closed out) table: double-tap = checked and clear, mark it open; a single tap opens the details after a moment
        var key = ar + '|' + nm, nowT = Date.now();
        if (lastTap.key === key && nowT - lastTap.t < 450){
          clearTimeout(lastTap.timer); lastTap = {};
          api('set_status', { area_key: ar, table_num: nm, status: 'open' }).then(function(){ toast('Table ' + nm + ' is open'); load(); });
          return;
        }
        lastTap = { key: key, t: nowT, timer: setTimeout(function(){ lastTap = {}; tableSheet(ar, nm); }, 450) };
        return;
      }
      tableSheet(ar, nm);
    }
    return;
  }
  var a = el.getAttribute('data-a'), area = el.getAttribute('data-area'), num = el.getAttribute('data-t');
  if (a === 'close') return closeSheet();
  if (a === 'resv') return resvSheet();
  if (a === 'toclear') return toClearSheet();
  if (a === 'openfromlist') return api('set_status', { area_key: area, table_num: num, status: 'open' }).then(function(){ toast('Table ' + num + ' is open'); return load(); }).then(toClearSheet);
  if (a === 'setup') return token ? setupSheet() : unlockSheet();
  if (a === 'lock'){ token = null; store('floor_tok', null); closeSheet(); toast('Setup locked'); return render(); }
  if (a === 'area'){
    var k = el.getAttribute('data-k'), i = sel.indexOf(k);
    if (i >= 0) sel.splice(i, 1); else { sel.push(k); if (sel.length > 3) sel.shift(); }
    lstore('floor_sel', JSON.stringify(sel)); return render();
  }
  if (a === 'run') return tableSheet(area, num);
  if (a === 'seat') return api('set_status', { area_key: area, table_num: num, status: 'occupied', party_size: parseInt(el.getAttribute('data-n'), 10) }).then(function(){ closeSheet(); toast('Table ' + num + ' seated'); load(); });
  if (a === 'open') return api('set_status', { area_key: area, table_num: num, status: 'open' }).then(function(){ closeSheet(); toast('Table ' + num + ' is open'); load(); });
  if (a === 'call') return api('call', { area_key: area, table_num: num, kind: el.getAttribute('data-k'), by: lstore('floor_by') || '' }).then(function(){ closeSheet(); toast((el.getAttribute('data-k') === 'food' ? 'Food' : 'Drinks') + ' call sent - table ' + num); load(); });
  if (a === 'clearcall') return api('clear_call', { area_key: area, table_num: num, kind: el.getAttribute('data-k') || undefined }).then(function(){ closeSheet(); toast('Cleared'); load(); });
  if (a === 'unlock'){
    var who = $('#uWho').value, pin = ($('#uPin').value || '').trim();
    if (!/^\d{4,8}$/.test(pin)) return toast('Enter the PIN');
    return api('unlock', { pin: pin, staff_id: who || undefined }).then(function(r){
      if (r.ok){ token = r.data.token; store('floor_tok', token); closeSheet(); render(); setupSheet(); }
      else toast(r.status === 429 ? 'Too many tries - wait a few minutes' : 'Wrong PIN');
    });
  }
  if (a === 'tvarea'){
    var tv = (S.tvs || []).filter(function(t){ return t.tv === el.getAttribute('data-tv'); })[0]; if (!tv) return;
    var areas = tv.areas.slice(), k2 = el.getAttribute('data-k'), j = areas.indexOf(k2);
    if (j >= 0){ if (areas.length === 1) return toast('Keep at least one chart'); areas.splice(j, 1); } else { areas.push(k2); if (areas.length > 3) areas.shift(); }
    return saveTv(tv.tv, tv.label, areas);
  }
  if (a === 'addtv'){
    var nm = ($('#newTv').value || '').trim(); if (!nm) return toast('Give the TV a name');
    return saveTv(nm.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, ''), nm, ['inside']);
  }
  if (a === 'deltv'){
    if (el.dataset.armed !== '1'){ el.dataset.armed = '1'; el.textContent = 'Tap again'; setTimeout(function(){ el.dataset.armed = ''; el.textContent = 'Remove'; }, 3500); return; }
    return api('delete_tv', { token: token, tv: el.getAttribute('data-tv') }).then(function(){ load().then(setupSheet); });
  }
  if (a === 'editlayout') return startEdit(el.getAttribute('data-k'));
  if (a === 'addtable'){
    var n = ($('#addNum').value || '').trim().toUpperCase(); if (!n) return toast('Type the table number');
    if (editTables.some(function(t){ return t.table_num === n; })) return toast('That table already exists');
    editTables.push({ area_key: editArea, table_num: n, x: 50, y: 50, active: true }); editSel = n; render(); editBar(); return;
  }
  if (a === 'rmtable'){
    if (!editSel) return toast('Tap a table first');
    var row = editTables.filter(function(t){ return t.table_num === editSel; })[0];
    if (el.dataset.armed !== '1'){ el.dataset.armed = '1'; el.textContent = 'Tap again to remove ' + editSel; setTimeout(function(){ el.dataset.armed = ''; el.textContent = 'Remove selected'; }, 3500); return; }
    if (row){ row.active = false; } editTables = editTables.filter(function(t){ return t.active; });
    removedNums.push(editSel); editSel = null; render(); editBar(); return;
  }
  if (a === 'cancelEdit'){ editArea = null; editTables = null; editSel = null; removedNums = []; return load(); }
  if (a === 'savelayout'){
    var payload = editTables.map(function(t){ return { table_num: t.table_num, x: t.x, y: t.y, active: true }; })
      .concat(removedNums.map(function(n){ return { table_num: n, x: 50, y: 50, active: false }; }));
    return api('save_layout', { token: token, area_key: editArea, tables: payload }).then(function(r){
      if (r.status === 401){ token = null; store('floor_tok', null); toast('Setup locked - enter the PIN again'); editArea = null; editTables = null; return load(); }
      if (!r.ok) return toast(r.data && r.data.error ? r.data.error : 'Could not save');
      toast('Layout saved'); editArea = null; editTables = null; editSel = null; removedNums = []; load();
    });
  }
});
var removedNums = [];
var lastTap = {};
$('#scrim').addEventListener('click', closeSheet);
window.addEventListener('resize', function(){ sizeBoard(); });

/* ---------------- reservations-only page (every staff board links here) ---------------- */
var RESV_FN = 'https://nkulhtalltbieicvmmad.supabase.co/functions/v1/floor-resv';
var RP = { mode: 'today', date: '' };
function bizDay(offset){
  return new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Chicago' }).format(new Date(Date.now() - 4 * 3600000 + (offset || 0) * 86400000));
}
function dayLabel(d){ return new Date(d + 'T12:00:00Z').toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric', timeZone: 'UTC' }); }
function resvRow(x){
  var t = new Date(x.starts_at).toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', timeZone: 'America/Chicago' });
  return '<div class="resv"><div class="t">' + esc(t) + '</div><div class="b"><div class="nm">' + esc(x.name) + '</div><div class="d">' + esc(x.type) +
    (x.party ? ' &middot; ' + x.party + ' guests' : '') + (x.space ? ' &middot; ' + esc(x.space) : '') + (x.status === 'tentative' ? ' &middot; tentative' : '') + '</div></div></div>';
}
function resvRange(){
  var t = bizDay(0);
  if (RP.mode === 'tomorrow') return { from: bizDay(1), to: bizDay(1) };
  if (RP.mode === 'week') return { from: t, to: bizDay(6) };
  if (RP.mode === 'month') return { from: t, to: bizDay(29) };
  if (RP.mode === 'date' && RP.date) return { from: RP.date, to: RP.date };
  return { from: t, to: t };
}
var resvSeq = 0;
function loadResvPage(quiet){
  var rg = resvRange(), box = $('#resvbody'), my = ++resvSeq; if (!box) return;
  if (!quiet) box.innerHTML = '<div class="lbl" style="margin-top:14px">Loading...</div>';
  fetch(RESV_FN, { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify(rg) })
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (my !== resvSeq) return;
      var list = d.reservations || [], multi = d.from !== d.to, h = '';
      if (!list.length){
        box.innerHTML = '<div class="lbl" style="margin-top:14px">Nothing on the books ' + (multi ? 'in this stretch' : (d.from === d.today ? 'today' : 'for ' + esc(dayLabel(d.from)))) + '</div>';
        return;
      }
      h += '<div class="lbl" style="margin-top:14px">' + list.length + (list.length === 1 ? ' reservation or party' : ' reservations and parties') +
        (multi ? '' : (d.from === d.today ? ' today' : ' &middot; ' + esc(dayLabel(d.from)))) + '</div>';
      if (!multi){ h += list.map(resvRow).join(''); }
      else {
        var by = {}, order = [];
        list.forEach(function(x){ if (!by[x.day]){ by[x.day] = []; order.push(x.day); } by[x.day].push(x); });
        order.forEach(function(day){
          h += '<div class="dayh"><span>' + (day === d.today ? 'Today &middot; ' : '') + esc(dayLabel(day)) + '</span><small>' + by[day].length + (by[day].length === 1 ? ' booking' : ' bookings') + '</small></div>' + by[day].map(resvRow).join('');
        });
      }
      box.innerHTML = h;
    })
    .catch(function(){ if (my !== resvSeq) return; box.innerHTML = '<div class="lbl" style="margin-top:14px">Could not load reservations. Check the connection.</div>'; });
}
function renderResvPage(first){
  if (first){
    $('#hdr').innerHTML = '<h1>The Quarry</h1><span class="tvname">Reservations</span><span class="sp"></span>' + (EMBED ? '' : '<a class="hbtn" href="./" style="text-decoration:none">Back to checklist</a>') + '<span class="clock" id="clock"></span>';
    tick();
    var chips = [['today', 'Today'], ['tomorrow', 'Tomorrow'], ['week', 'Next 7 days'], ['month', 'Next 30 days']].map(function(c){
      return '<button data-rm="' + c[0] + '" class="' + (RP.mode === c[0] ? 'on' : '') + '">' + c[1] + '</button>';
    }).join('');
    $('#boardwrap').innerHTML = '<div style="width:100%;max-width:760px;margin:0 auto;padding-bottom:40px"><div class="dchips">' + chips +
      '<input type="date" id="rdate" min="' + bizDay(0) + '" max="' + bizDay(120) + '" aria-label="Pick a date"></div><div id="resvbody"></div></div>';
    $('#boardwrap').addEventListener('click', function(e){
      var b = e.target.closest('[data-rm]'); if (!b) return;
      RP.mode = b.getAttribute('data-rm'); RP.date = ''; $('#rdate').value = '';
      document.querySelectorAll('.dchips button').forEach(function(x){ x.classList.toggle('on', x === b); });
      loadResvPage();
    });
    $('#rdate').addEventListener('change', function(){
      if (!this.value) return; RP.mode = 'date'; RP.date = this.value;
      document.querySelectorAll('.dchips button').forEach(function(x){ x.classList.remove('on'); });
      loadResvPage();
    });
  }
  loadResvPage(!first);
}

/* ---------------- TV only: keep the screen awake and always run the newest page ---------------- */
var wakeLock = null;
function keepAwake(){
  try {
    if (navigator.wakeLock && navigator.wakeLock.request){
      navigator.wakeLock.request('screen').then(function(l){ wakeLock = l; l.addEventListener('release', function(){ wakeLock = null; }); }).catch(function(){});
    }
  } catch (e) {}
}
// A silently "playing" video also stops most TV browsers from sleeping (no file needed: it is drawn live).
function awakeVideo(){
  try {
    var c = document.createElement('canvas'); c.width = 16; c.height = 16; var g = c.getContext('2d'), n = 0;
    setInterval(function(){ n++; g.fillStyle = n % 2 ? '#1a1a1a' : '#1b1b1b'; g.fillRect(0, 0, 16, 16); }, 1000);
    if (!c.captureStream) return;
    var v = document.createElement('video'); v.muted = true; v.setAttribute('muted', ''); v.setAttribute('playsinline', ''); v.loop = true;
    v.style.cssText = 'position:fixed;right:0;bottom:0;width:2px;height:2px;opacity:.02;pointer-events:none';
    v.srcObject = c.captureStream(2); document.body.appendChild(v);
    var p = v.play(); if (p && p.catch) p.catch(function(){});
  } catch (e) {}
}
var pageSig = null;
function sigOf(t){ var h = 5381; for (var i = 0; i < t.length; i++) h = ((h << 5) + h + t.charCodeAt(i)) | 0; return h + ':' + t.length; }
function checkVersion(){
  fetch(location.pathname + '?_v=' + Date.now(), { cache: 'no-store' }).then(function(r){ return r.text(); }).then(function(t){
    var s = sigOf(t); if (pageSig === null) pageSig = s; else if (s !== pageSig) location.reload();
  }).catch(function(){});
}
if (DISPLAY){
  keepAwake(); awakeVideo(); setInterval(keepAwake, 60000);
  document.addEventListener('visibilitychange', function(){ if (!document.hidden) keepAwake(); });
  checkVersion(); setInterval(checkVersion, 120000);
}

/* ---------------- boot ---------------- */
if (ONLY){ renderResvPage(true); setInterval(function(){ renderResvPage(false); }, 60000); throw new Error('reservations-only page'); }
token = store('floor_tok') || null;
if (!DISPLAY){
  try { sel = JSON.parse(lstore('floor_sel') || '[]'); } catch (e) { sel = []; }
  if (!sel.length) sel = ['inside'];
}
load().then(function(){ if (!DISPLAY && QS.get('view') === 'reservations') resvSheet(); });
loadResv(); setInterval(loadResv, 120000); setInterval(renderResv, 60000);
timer = setInterval(function(){ if (!editArea && !$('#sheet').classList.contains('on')) load(); }, DISPLAY ? 6000 : 8000);
setInterval(tick, 15000);
document.addEventListener('visibilitychange', function(){ if (!document.hidden && !editArea) load(); });
</script>
