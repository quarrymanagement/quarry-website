<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>Self-Evaluation · The Quarry</title>
<link rel="icon" href="/favicon-32.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{ --charcoal:#1A1A1A; --brown:#2C1A0E; --cream:#F5F0E8; --gold:#B8933A; --gold2:#D4AF6A; --ink:#1f1b16; --muted:#7a6e60; --line:#e6dfd3;
         --bad:#a52a1e; --bad-bg:#fdeeee; --ok:#176b34; --ok-bg:#e7f5ec; --warn:#8a5a00; --warn-bg:#fff4d6; }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{margin:0;font-family:Montserrat,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;background:var(--cream);color:var(--ink);line-height:1.5;}
  .top{background:var(--charcoal);padding:14px 18px;display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:5;}
  .top img{width:32px;height:32px;}
  .top .brand{font-family:'Playfair Display',Georgia,serif;color:var(--gold);letter-spacing:3px;font-size:17px;}
  .top .tag{margin-left:auto;color:#cfc4b2;font-size:11px;text-transform:uppercase;letter-spacing:1px;text-align:right;}
  .prog{height:4px;background:#3a3027;position:sticky;top:60px;z-index:5;} .prog i{display:block;height:100%;background:var(--gold);transition:width .25s;}
  .wrap{max-width:680px;margin:0 auto;padding:18px 16px 70px;}
  .card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:14px;}
  h1{font-family:'Playfair Display',Georgia,serif;font-size:25px;margin:0 0 6px;color:var(--brown);line-height:1.2;}
  h2{font-family:'Playfair Display',Georgia,serif;font-size:20px;margin:0 0 8px;color:var(--brown);line-height:1.25;}
  .eyebrow{font-size:11px;font-weight:700;letter-spacing:1.4px;text-transform:uppercase;color:var(--gold);margin-bottom:6px;}
  .sub{color:var(--muted);font-size:14px;}
  .q{font-size:17px;font-weight:600;margin:4px 0 14px;}
  .opt{display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;background:#fffdf9;border:1.5px solid var(--line);border-radius:12px;padding:14px;margin-bottom:10px;font:inherit;font-size:15px;color:var(--ink);cursor:pointer;}
  .opt .dot{flex:none;width:22px;height:22px;border-radius:50%;border:2px solid #c9bda9;margin-top:1px;}
  .opt.on{border-color:var(--brown);background:#faf5ec;} .opt.on .dot{border-color:var(--brown);background:radial-gradient(var(--brown) 45%,transparent 50%);}
  .scene{background:var(--charcoal);color:#f1e9dc;border-radius:12px;padding:14px 16px;font-size:15px;margin-bottom:12px;}
  .scene b{color:var(--gold2);display:block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;margin-bottom:4px;}
  textarea{width:100%;min-height:190px;border:1.5px solid #d5cbbb;border-radius:12px;padding:14px;font-size:16px;font-family:inherit;background:#fffdf9;resize:vertical;line-height:1.5;}
  textarea:focus,.opt:focus-visible,.btn:focus-visible{outline:2px solid rgba(184,147,58,.55);outline-offset:2px;}
  .wc{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;justify-content:space-between;gap:8px;}
  .wc.ok{color:var(--ok);}
  .tip{background:var(--warn-bg);color:#6b4e00;border-radius:10px;padding:10px 12px;font-size:13.5px;margin-bottom:12px;}
  .nav{display:flex;gap:10px;margin-top:6px;}
  .btn{flex:1;background:var(--brown);color:#fff;border:0;border-radius:12px;padding:15px;font-size:15.5px;font-weight:700;font-family:inherit;cursor:pointer;}
  .btn.sec{background:#fff;color:var(--ink);border:1.5px solid var(--line);flex:0 0 auto;padding:15px 18px;}
  .btn.gold{background:var(--gold);color:#1a1a1a;}
  .btn:disabled{opacity:.4;cursor:not-allowed;}
  .err{color:var(--bad);font-size:14px;margin-top:10px;min-height:1px;}
  .state{text-align:center;padding:40px 22px;}
  .spinner{width:34px;height:34px;border:4px solid var(--line);border-top-color:var(--gold);border-radius:50%;animation:spin 1s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .score{display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .score .n{font-family:'Playfair Display',Georgia,serif;font-size:52px;line-height:1;color:var(--brown);font-variant-numeric:tabular-nums;}
  .pill{display:inline-block;padding:4px 11px;border-radius:999px;font-size:12px;font-weight:700;letter-spacing:.3px;}
  .pill.ok{background:var(--ok-bg);color:var(--ok);} .pill.bad{background:var(--bad-bg);color:var(--bad);} .pill.warn{background:var(--warn-bg);color:var(--warn);}
  .res{border-top:1px solid var(--line);padding:12px 0;}
  .res:first-of-type{border-top:0;}
  .res .rq{font-weight:600;font-size:14.5px;display:flex;gap:8px;}
  .res .mark{flex:none;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;}
  .mark.y{background:var(--ok-bg);color:var(--ok);} .mark.n{background:var(--bad-bg);color:var(--bad);}
  .res .ra{font-size:13.5px;color:var(--muted);margin:4px 0 0 30px;}
  .res .ra b{color:var(--ink);font-weight:600;}
  .ans{white-space:pre-wrap;background:var(--cream);border-radius:10px;padding:12px;font-size:14.5px;margin:8px 0;}
  .mnote{border-left:3px solid var(--gold);padding:8px 12px;background:#fffaf0;border-radius:0 8px 8px 0;font-size:14.5px;margin-top:8px;white-space:pre-wrap;}
  .mnote span{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;color:var(--gold);margin-bottom:2px;}
  .checklist{display:flex;flex-direction:column;gap:6px;margin:12px 0;}
  .checklist div{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:8px 10px;background:var(--cream);border-radius:8px;}
  .foot{text-align:center;color:var(--muted);font-size:11px;margin-top:20px;}
  @media (prefers-reduced-motion:reduce){.prog i{transition:none}.spinner{animation:none}}
  /* self-evaluation additions */
  .std{background:var(--cream);border-left:3px solid var(--gold);border-radius:0 10px 10px 0;padding:12px 14px;font-size:15px;margin-bottom:14px;}
  .std b{display:block;font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--gold);margin-bottom:3px;}
  .scale{display:flex;flex-direction:column;gap:8px;margin-bottom:16px;}
  .rate{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:#fffdf9;border:1.5px solid var(--line);border-radius:12px;padding:11px 14px;font:inherit;color:var(--ink);cursor:pointer;}
  .rate .num{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid #c9bda9;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;color:var(--muted);}
  .rate .lb{font-weight:600;font-size:15px;display:block;} .rate .ht{font-size:12.5px;color:var(--muted);display:block;}
  .rate.on{border-color:var(--brown);background:#faf5ec;} .rate.on .num{background:var(--brown);border-color:var(--brown);color:#fff;}
  textarea.short{min-height:120px;}
  .cmp{display:grid;grid-template-columns:1fr auto auto;gap:6px 14px;align-items:center;padding:12px 0;border-top:1px solid var(--line);}
  .cmp:first-of-type{border-top:0;}
  .cmp .t{font-weight:600;font-size:14.5px;}
  .cmp .r{text-align:center;min-width:54px;} .cmp .r small{display:block;font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.6px;}
  .cmp .r b{font-size:20px;font-family:'Playfair Display',Georgia,serif;color:var(--brown);}
  .cmp .full{grid-column:1/-1;}
  .gap{font-size:12px;font-weight:700;color:var(--warn);}
  .ex{font-size:13.5px;color:#4a4136;white-space:pre-wrap;}
  .rv{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:10px;background:#fffdf9;}
  .rv.neg{border-left:4px solid var(--bad);} .rv.pos{border-left:4px solid var(--ok);} .rv.you{border-left:4px solid var(--gold);}
  .rv .stars{color:var(--gold);font-size:14px;letter-spacing:1px;} .rv .stars i{color:#d9cfbf;font-style:normal;}
  .rv .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:8px;margin-bottom:6px;}
  .rv p{margin:0;font-size:14.5px;white-space:pre-wrap;}
  .rv .fix{margin-top:8px;font-size:13.5px;background:var(--cream);border-radius:8px;padding:8px 10px;} .rv .fix b{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.8px;color:var(--gold);}
  .grp{font-size:11px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted);margin:14px 0 8px;}
</style>
</head>
<body>
<div class="top"><img src="/assets/quarry-q-logo.png" alt=""><span class="brand">THE QUARRY</span><span class="tag">Self<br>Evaluation</span></div>
<div class="prog" id="prog" hidden><i id="progBar" style="width:0"></i></div>
<div class="wrap" id="app"><div class="card state"><div class="spinner"></div><p>Loading your evaluation…</p></div></div>
<div class="foot">The Quarry · 3960 Highway Z, New Melle, MO</div>

<script>
(function () {
  'use strict';
  var FN = 'https://nkulhtalltbieicvmmad.supabase.co/functions/v1/staff-evals';
  var FN_GOALS = 'https://nkulhtalltbieicvmmad.supabase.co/functions/v1/staff-checkins';
  var KEY = 'sb_publishable_FQK59Bn8P2jV8yGL0nPi7w_jVHFMBSl';
  var TOKEN = new URLSearchParams(location.search).get('t') || '';
  var app = document.getElementById('app');
  var D = null;
  var A = { ratings: {}, examples: {}, open: {}, goals: [{}, {}] };
  var MIN_GOAL = 6;
  var step = 0;   // 0 intro, 1..nAreas areas, then open questions, then review
  var SAVE_KEY = 'qev-' + TOKEN.slice(0, 16);

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function words(s) { return String(s || '').trim().split(/\s+/).filter(Boolean).length; }
  function callGoals(body) {
    return fetch(FN_GOALS, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + KEY }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); }).catch(function () { return { error: 'Connection problem — check your signal and try again.' }; });
  }
  function call(body) {
    return fetch(FN, { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: KEY, Authorization: 'Bearer ' + KEY }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); }).catch(function () { return { error: 'Connection problem — check your signal and try again.' }; });
  }
  function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify({ A: A, step: step })); } catch (e) {} }
  function restore() { try { var s = JSON.parse(localStorage.getItem(SAVE_KEY) || 'null'); if (s && s.A) { A = s.A; A.open = A.open || {}; A.goals = A.goals || [{}, {}]; step = s.step || 0; } } catch (e) {} }
  function clearSave() { try { localStorage.removeItem(SAVE_KEY); } catch (e) {} }
  function stateCard(title, msg) { document.getElementById('prog').hidden = true; app.innerHTML = '<div class="card state"><h2>' + esc(title) + '</h2><p class="sub">' + msg + '</p></div>'; }
  function first() { return String(D.employee_name || '').split(' ')[0]; }
  function stars(n) { n = +n || 0; return '<span class="stars">' + '★★★★★'.slice(0, n) + '<i>' + '★★★★★'.slice(0, 5 - n) + '</i></span>'; }
  function reviewsHtml(list) {
    function card(r) {
      var cls = r.about_you ? 'you' : ((r.rating || 5) <= 3 ? 'neg' : 'pos');
      return '<div class="rv ' + cls + '"><div class="meta">' + (r.rating ? stars(r.rating) : '<span></span>') + '<span>' + esc(r.date ? new Date(r.date + 'T12:00:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' }) : '') + '</span></div>' +
        '<p>' + esc(r.body) + '</p>' + (r.note ? '<div class="fix"><b>What we’re changing</b>' + esc(r.note) + '</div>' : '') + '</div>';
    }
    var you = list.filter(function (r) { return r.about_you; }), neg = list.filter(function (r) { return !r.about_you && (r.rating || 5) <= 3; }), pos = list.filter(function (r) { return !r.about_you && (r.rating || 5) > 3; });
    return (you.length ? '<div class="grp">Guests who mentioned you</div>' + you.map(card).join('') : '') +
      (neg.length ? '<div class="grp">Where we fell short</div>' + neg.map(card).join('') : '') +
      (pos.length ? '<div class="grp">What guests loved</div>' + pos.map(card).join('') : '');
  }
  function label(v) { var s = (D.scale || []).filter(function (x) { return x.v === v; })[0]; return s ? s.label : ''; }

  if (!TOKEN) { stateCard('Link incomplete', 'This link is missing part of its address. Open it again from your email or text.'); return; }

  call({ action: 'eval_load', token: TOKEN }).then(function (r) {
    if (r.error) { stateCard(r.voided ? 'Evaluation withdrawn' : 'Can’t open this evaluation', esc(r.error)); return; }
    D = r;
    if (r.view) { clearSave(); results(); return; }
    restore(); render();
  });

  function nF() { return (D.feedback && D.feedback.length) ? 1 : 0; }
  function nA() { return D.form.areas.length; }
  function nO() { return D.form.open.length; }
  function total() { return 1 + nF() + nA() + nO() + 1 + 1; }
  function setProg() {
    var p = document.getElementById('prog'); p.hidden = step === 0;
    document.getElementById('progBar').style.width = Math.round(100 * step / (total() - 1)) + '%';
  }
  function go(n) { step = n; save(); render(); window.scrollTo(0, 0); }
  function render() {
    setProg();
    if (step === 0) return intro();
    if (nF() && step === 1) return feedbackStep();
    var k = step - nF();
    if (k <= nA()) return areaStep(k - 1);
    if (k <= nA() + nO()) return openStep(k - 1 - nA());
    if (k === nA() + nO() + 1) return goalsStep();
    return review();
  }

  function intro() {
    var started = Object.keys(A.ratings).length;
    app.innerHTML = '<div class="card"><div class="eyebrow">' + esc(D.ref_no) + '</div><h1>Hi ' + esc(first()) + ' — your ' + esc(D.title) + '</h1>' +
      '<p class="sub" style="font-size:15px;color:#3e362c">' + esc(D.intro) + '</p>' +
      '<div class="checklist">' + (nF() ? '<div><span>Guest reviews to read</span><b>' + D.feedback.length + '</b></div>' : '') + '<div><span>Standards to rate</span><b>' + nA() + '</b></div><div><span>Questions at the end</span><b>' + nO() + '</b></div><div><span>Time</span><b>About 10–15 minutes</b></div></div>' +
      '<p class="sub">Your answers save on this phone as you go, so you can close it and come back to this link.</p>' +
      '<div class="nav" style="margin-top:16px"><button class="btn" id="start">' + (started ? 'Pick up where I left off' : 'Start') + '</button></div></div>';
    document.getElementById('start').onclick = function () { go(step || 1); };
  }

  function feedbackStep() {
    app.innerHTML = '<div class="card"><div class="eyebrow">Before you start</div><h2>What guests are saying</h2>' +
      '<p class="sub">Real reviews from the last two months. The complaints matter most. Keep them in mind as you rate yourself; you’ll be asked about one at the end.</p>' +
      reviewsHtml(D.feedback) +
      '<div class="nav" style="margin-top:12px"><button class="btn sec" id="back">Back</button><button class="btn" id="next">Got it</button></div></div>';
    document.getElementById('back').onclick = function () { go(step - 1); };
    document.getElementById('next').onclick = function () { go(step + 1); };
  }

  function areaStep(i) {
    var a = D.form.areas[i], min = D.min.example, chosen = A.ratings[a.id];
    app.innerHTML = '<div class="card"><div class="eyebrow">Standard ' + (i + 1) + ' of ' + nA() + '</div><h2>' + esc(a.title) + '</h2>' +
      '<div class="std"><b>The standard</b>' + esc(a.standard) + '</div>' +
      '<div class="q" style="margin-bottom:10px">How often do you hit this?</div>' +
      '<div class="scale">' + D.scale.map(function (s) {
        return '<button class="rate' + (chosen === s.v ? ' on' : '') + '" data-v="' + s.v + '"><span class="num">' + s.v + '</span><span><span class="lb">' + esc(s.label) + '</span><span class="ht">' + esc(s.hint) + '</span></span></button>';
      }).join('') + '</div>' +
      '<label for="ta" class="q" style="display:block;margin-bottom:8px;font-size:15.5px">' + esc(a.prompt) + '</label>' +
      '<textarea id="ta" class="short" placeholder="A real example from a shift…">' + esc(A.examples[a.id] || '') + '</textarea>' +
      '<div class="wc" id="wc"></div>' +
      '<div class="nav" style="margin-top:12px"><button class="btn sec" id="back">Back</button><button class="btn" id="next">Next</button></div></div>';
    var ta = document.getElementById('ta'), wc = document.getElementById('wc'), nx = document.getElementById('next');
    function upd() {
      var n = words(ta.value); A.examples[a.id] = ta.value; save();
      wc.className = 'wc' + (n >= min ? ' ok' : '');
      wc.innerHTML = '<span>' + n + ' words</span><span>' + (n >= min ? '✓ Good' : 'At least ' + min + ' words') + '</span>';
      nx.disabled = n < min || A.ratings[a.id] == null;
    }
    Array.prototype.forEach.call(app.querySelectorAll('.rate'), function (b) {
      b.onclick = function () {
        A.ratings[a.id] = +b.dataset.v;
        Array.prototype.forEach.call(app.querySelectorAll('.rate'), function (x) { x.classList.toggle('on', x === b); });
        upd();
      };
    });
    ta.oninput = upd; upd();
    document.getElementById('back').onclick = function () { go(step - 1); };
    nx.onclick = function () { go(step + 1); };
  }

  function openStep(i) {
    var o = D.form.open[i], min = D.min.open;
    app.innerHTML = '<div class="card"><div class="eyebrow">Last part · Question ' + (i + 1) + ' of ' + nO() + '</div>' +
      '<label for="ta" class="q" style="display:block;margin-bottom:10px">' + esc(o.q) + '</label>' +
      (o.id === 'guest' && nF() ? '<details style="margin-bottom:10px"><summary class="sub" style="cursor:pointer">See the reviews again</summary>' + reviewsHtml(D.feedback) + '</details>' : '') +
      '<textarea id="ta">' + esc(A.open[o.id] || '') + '</textarea><div class="wc" id="wc"></div>' +
      '<div class="nav" style="margin-top:12px"><button class="btn sec" id="back">Back</button><button class="btn" id="next">Next</button></div></div>';
    var ta = document.getElementById('ta'), wc = document.getElementById('wc'), nx = document.getElementById('next');
    function upd() {
      var n = words(ta.value); A.open[o.id] = ta.value; save();
      wc.className = 'wc' + (n >= min ? ' ok' : '');
      wc.innerHTML = '<span>' + n + ' words</span><span>' + (n >= min ? '✓ Good' : 'At least ' + min + ' words') + '</span>';
      nx.disabled = n < min;
    }
    ta.oninput = upd; upd();
    document.getElementById('back').onclick = function () { go(step - 1); };
    nx.onclick = function () { go(step + 1); };
  }

  function goalsOk() { return [0, 1].every(function (i) { var g = A.goals[i] || {}; return !!g.area_id && words(g.goal) >= MIN_GOAL; }); }
  function goalsStep() {
    var areas = D.form.areas;
    if (!A.goals[0].area_id) {
      var low = areas.slice().sort(function (a, b) { return (A.ratings[a.id] || 9) - (A.ratings[b.id] || 9); })[0];
      if (low) A.goals[0].area_id = low.id;
    }
    function slot(i) {
      var g = A.goals[i] || {};
      return '<div class="card" style="padding:14px;margin-bottom:12px;background:#fffdf9"><div class="eyebrow">Goal ' + (i + 1) + '</div>' +
        '<label class="sub" style="display:block;margin-bottom:6px">Which standard?</label>' +
        '<select data-i="' + i + '" class="gsel" style="width:100%;padding:12px;border:1.5px solid #d5cbbb;border-radius:10px;font:inherit;font-size:15px;background:#fff;margin-bottom:10px"><option value="">Pick one</option>' +
        areas.map(function (a) { return '<option value="' + esc(a.id) + '"' + (g.area_id === a.id ? ' selected' : '') + '>' + esc(a.title) + (A.ratings[a.id] ? ' (you said ' + A.ratings[a.id] + ')' : '') + '</option>'; }).join('') + '</select>' +
        '<label class="sub" style="display:block;margin-bottom:6px">What exactly will you do next week?</label>' +
        '<textarea data-i="' + i + '" class="gta short" placeholder="e.g. Greet every new table within a minute, even when I’m slammed, by doing a quick hello before I finish what I’m doing">' + esc(g.goal || '') + '</textarea><div class="wc" id="gwc' + i + '"></div></div>';
    }
    app.innerHTML = '<div class="card"><div class="eyebrow">Almost done</div><h2>Your goals for next week</h2>' +
      '<p class="sub">Pick two standards to work on, and say exactly what you’ll do. Make it something we could see you doing on a shift. Every week you’ll get a quick check-in asking how it went, and managers and owners read every one and reply with feedback.</p>' +
      slot(0) + slot(1) +
      '<div class="nav"><button class="btn sec" id="back">Back</button><button class="btn" id="next">Next</button></div></div>';
    var nx = document.getElementById('next');
    function upd() {
      [0, 1].forEach(function (i) { var n = words((A.goals[i] || {}).goal), w = document.getElementById('gwc' + i); if (w) { w.className = 'wc' + (n >= MIN_GOAL ? ' ok' : ''); w.innerHTML = '<span>' + n + ' words</span><span>' + (n >= MIN_GOAL ? '✓ Good' : 'At least ' + MIN_GOAL + ' words') + '</span>'; } });
      save(); nx.disabled = !goalsOk();
    }
    Array.prototype.forEach.call(app.querySelectorAll('.gsel'), function (el) { el.onchange = function () { A.goals[+el.dataset.i].area_id = el.value; upd(); }; });
    Array.prototype.forEach.call(app.querySelectorAll('.gta'), function (el) { el.oninput = function () { A.goals[+el.dataset.i].goal = el.value; upd(); }; });
    upd();
    document.getElementById('back').onclick = function () { go(step - 1); };
    nx.onclick = function () { go(step + 1); };
  }
  function goalsPayload() {
    return A.goals.filter(function (g) { return g && g.area_id && words(g.goal) >= MIN_GOAL; }).map(function (g) {
      var a = D.form.areas.filter(function (x) { return x.id === g.area_id; })[0];
      return { area_id: g.area_id, area_title: a ? a.title : '', goal: g.goal };
    });
  }

  function review() {
    var areas = D.form.areas;
    var bad = areas.filter(function (a) { return A.ratings[a.id] == null || words(A.examples[a.id]) < D.min.example; }).length +
      D.form.open.filter(function (o) { return words(A.open[o.id]) < D.min.open; }).length + (goalsOk() ? 0 : 1);
    app.innerHTML = '<div class="card"><div class="eyebrow">Ready to submit</div><h1>Check your ratings</h1>' +
      '<p class="sub" style="font-size:15px">Once you submit, you can’t change anything. Management will rate the same standards and you’ll see both on this link.</p>' +
      '<div class="checklist">' + areas.map(function (a) {
        var v = A.ratings[a.id];
        return '<div><span>' + esc(a.title) + '</span><b>' + (v ? v + ' · ' + esc(label(v)) : '<span style="color:var(--bad)">Not rated</span>') + '</b></div>';
      }).join('') + goalsPayload().map(function (g, i) { return '<div><span>Goal ' + (i + 1) + ': ' + esc(g.area_title) + '</span><b>✓</b></div>'; }).join('') + '</div>' +
      '<div class="nav"><button class="btn sec" id="back">Back</button><button class="btn gold" id="sub"' + (bad ? ' disabled' : '') + '>Submit</button></div><div class="err" id="er"></div></div>';
    document.getElementById('back').onclick = function () { go(step - 1); };
    document.getElementById('sub').onclick = function () {
      var b = this; b.disabled = true; b.textContent = 'Submitting…';
      call({ action: 'eval_submit', token: TOKEN, ratings: A.ratings, examples: A.examples, open: A.open }).then(function (r) {
        if (r.error && !r.done) { b.disabled = false; b.textContent = 'Submit'; document.getElementById('er').textContent = r.error; return; }
        if (r.done) { location.reload(); return; }
        var gp = goalsPayload();
        callGoals({ action: 'goals_set', token: TOKEN, goals: gp }).then(function (g) {
          if (g && g.error) { try { localStorage.setItem(SAVE_KEY + '-g', JSON.stringify(gp)); } catch (e) {} }
          clearSave(); D = r; results(); window.scrollTo(0, 0);
        });
      });
    };
  }

  function loadGoals() {
    var pending = null; try { pending = JSON.parse(localStorage.getItem(SAVE_KEY + '-g') || 'null'); } catch (e) {}
    var p = pending && pending.length ? callGoals({ action: 'goals_set', token: TOKEN, goals: pending }).then(function (r) { if (!r.error) { try { localStorage.removeItem(SAVE_KEY + '-g'); } catch (e) {} } return r; }) : callGoals({ action: 'goals_get', token: TOKEN });
    p.then(function (r) {
      var box = document.getElementById('goalsCard'); if (!box) return;
      var gs = (r && r.goals) || [];
      if (r && r.error && !gs.length) { box.innerHTML = '<div class="eyebrow">Your goals</div><p class="sub">' + esc(r.error) + '</p>'; return; }
      var act = gs.filter(function (g) { return g.status === 'active'; }), done = gs.filter(function (g) { return g.status === 'done'; });
      box.innerHTML = '<div class="eyebrow">Your goals for next week</div>' + (act.length ? act.map(function (g) {
        return '<div class="res"><div class="rq" style="justify-content:space-between"><span>' + esc(g.area_title || 'Goal') + '</span>' + (g.set_by === 'mgmt' ? '<span class="pill warn">From management</span>' : '') + '</div><div class="ans">' + esc(g.goal) + '</div></div>';
      }).join('') : '<p class="sub">No open goals.</p>') +
        (done.length ? '<p class="sub" style="margin-top:10px">Done: ' + done.map(function (g) { return esc(g.area_title || g.goal.slice(0, 40)); }).join(' · ') + '</p>' : '') +
        '<p class="sub" style="margin-top:10px">Each week you’ll get a quick check-in: did you do it, what happened, what’s next. Managers and owners read every one and reply with feedback.</p>';
    });
  }

  function results() {
    document.getElementById('prog').hidden = true;
    var V = D.view, h = '';
    h += '<div class="card"><div class="eyebrow">' + esc(D.title) + ' · ' + esc(D.ref_no) + '</div>';
    if (!V.responded) {
      h += '<h1>Submitted. Thanks, ' + esc(first()) + '.</h1><p class="sub" style="font-size:15px">Management is going through your answers and will rate the same standards. Open this same link later to see their response.</p>';
    } else {
      h += '<h1>Here’s how we see it, ' + esc(first()) + '</h1><p class="sub" style="font-size:15px">Your rating and management’s rating for each standard, side by side, with notes from ' + esc(V.responded_by || 'management') + '.</p>';
      if (V.strengths) h += '<div class="mnote" style="margin-top:12px"><span>What you do well</span>' + esc(V.strengths) + '</div>';
      if (V.focus) h += '<div class="mnote" style="margin-top:10px"><span>Focus for the next 30 days</span>' + esc(V.focus) + '</div>';
      if (V.overall_note) h += '<div class="mnote" style="margin-top:10px"><span>Note</span>' + esc(V.overall_note) + '</div>';
    }
    h += '</div>';

    h += '<div class="card"><div class="eyebrow">The standards</div>';
    V.areas.forEach(function (a) {
      var gap = V.responded && a.mgr != null && Math.abs(a.self - a.mgr) >= 2;
      h += '<div class="cmp"><span class="t">' + esc(a.title) + (gap ? '<div class="gap">We see this differently. Let’s talk.</div>' : '') + '</span>' +
        '<span class="r"><small>You</small><b>' + esc(a.self) + '</b></span>' +
        '<span class="r"><small>Mgmt</small><b>' + (V.responded ? esc(a.mgr) : '–') + '</b></span>' +
        '<div class="full ex">' + esc(a.example) + '</div>' +
        (a.mgr_note ? '<div class="full mnote"><span>Management note</span>' + esc(a.mgr_note) + '</div>' : '') + '</div>';
    });
    h += '<p class="sub" style="margin-top:10px;font-size:12.5px">' + D.scale.map(function (s) { return s.v + ' = ' + esc(s.label); }).join(' · ') + '</p></div>';

    if (V.feedback && V.feedback.length) h += '<div class="card"><div class="eyebrow">What guests were saying</div>' + reviewsHtml(V.feedback) + '</div>';
    h += '<div class="card"><div class="eyebrow">Your answers</div>' + V.open.map(function (o) {
      return '<div class="res"><div class="rq">' + esc(o.q) + '</div><div class="ans">' + esc(o.answer) + '</div>' + (o.mgr_note ? '<div class="mnote" style="margin-top:8px"><span>Management note</span>' + esc(o.mgr_note) + '</div>' : '') + '</div>';
    }).join('') + '</div>';

    if (V.responded && !V.acknowledged_at) {
      h += '<div class="card"><div class="eyebrow">Your turn</div><h2>What will you work on?</h2>' +
        '<p class="sub">Read management’s notes, then tell us in your own words what you’ll change over the next 30 days and anything you disagree with. Disagreeing is fine. Say why.</p>' +
        '<textarea id="refl" class="short"></textarea><div class="wc" id="rwc"></div>' +
        '<div class="nav" style="margin-top:12px"><button class="btn gold" id="ack" disabled>I’ve read this. Send my reflection</button></div><div class="err" id="er"></div></div>';
    } else if (V.acknowledged_at) {
      h += '<div class="card"><div class="eyebrow">Your reflection</div><div class="ans">' + esc(V.reflection) + '</div>' +
        '<p class="sub">Acknowledged ' + new Date(V.acknowledged_at).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' }) + '. Thanks, ' + esc(first()) + '.</p></div>';
    }
    h += '<div class="card" id="goalsCard"><div class="eyebrow">Your goals</div><p class="sub">Loading…</p></div>';
    app.innerHTML = h;
    loadGoals();

    var ta = document.getElementById('refl');
    if (ta) {
      var rk = SAVE_KEY + '-r', min = D.min.reflect, btn = document.getElementById('ack'), wc = document.getElementById('rwc');
      try { ta.value = localStorage.getItem(rk) || ''; } catch (e) {}
      var upd = function () {
        var n = words(ta.value); try { localStorage.setItem(rk, ta.value); } catch (e) {}
        wc.className = 'wc' + (n >= min ? ' ok' : ''); wc.innerHTML = '<span>' + n + ' words</span><span>' + (n >= min ? '✓ Good' : 'At least ' + min + ' words') + '</span>';
        btn.disabled = n < min;
      };
      ta.oninput = upd; upd();
      btn.onclick = function () {
        btn.disabled = true; btn.textContent = 'Sending…';
        call({ action: 'eval_ack', token: TOKEN, reflection: ta.value }).then(function (r) {
          if (r.error && !r.done) { btn.disabled = false; btn.textContent = 'I’ve read this. Send my reflection'; document.getElementById('er').textContent = r.error; return; }
          if (r.done) { location.reload(); return; }
          try { localStorage.removeItem(rk); } catch (e) {}
          D = r; results(); window.scrollTo(0, 0);
        });
      };
    }
  }
})();
</script>
</body>
</html>
