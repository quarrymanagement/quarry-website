<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Checklist">
<title>Shift Checklist &middot; The Quarry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ---------------------------------------------------------------
   Warm white + gold. Reads well on an iPad in daylight, and looks
   like somewhere you'd want to work rather than a server terminal.
   Gold is an accent and a fill; gold-ink is the darker tone used
   wherever gold has to carry small text at readable contrast.
   --------------------------------------------------------------- */
:root{
  --page:#FAF8F3;        /* warm white ground        */
  --card:#FFFFFF;        /* task cards               */
  --card-2:#F4EFE4;      /* pressed state            */
  --line:#E8E1D2;        /* warm hairline            */
  --line-2:#F0EADE;      /* lighter divider          */
  --text:#23201B;        /* primary copy             */
  --dim:#736A5C;         /* secondary copy           */
  --faint:#A2988A;       /* tertiary / labels        */
  --gold:#B8933A;        /* fills, bars, active      */
  --gold-ink:#8A6B1E;    /* gold as small text       */
  --gold-soft:#FBF4E3;   /* gold tint background     */
  --green:#2F7D36; --green-soft:#EDF7EE; --green-line:#BFE3C4;
  --red:#B3382F;   --red-soft:#FBEDEB;   --red-line:#F0CCC7;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
body{
  background:var(--page); color:var(--text);
  font:16px/1.45 Montserrat,-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;
  -webkit-font-smoothing:antialiased; padding-bottom:calc(48px + env(safe-area-inset-bottom));
}
button{font-family:inherit;color:inherit;border:none;background:none}

/* ---------------- header ---------------- */
header{
  position:sticky; top:0; z-index:40; background:var(--card);
  border-bottom:1px solid var(--line);
  padding:calc(10px + env(safe-area-inset-top)) 18px 0;
}
.top{display:flex; align-items:center; gap:14px}
.mark{
  font-family:'Playfair Display',Georgia,serif; font-size:15px; letter-spacing:.22em;
  text-transform:uppercase; color:var(--gold-ink); white-space:nowrap;
}
.day{font-size:12px; color:var(--faint); letter-spacing:.06em; text-transform:uppercase}
.top .sp{flex:1}
.ghost{
  border:1px solid var(--line); border-radius:999px; padding:8px 15px;
  font-size:11px; letter-spacing:.1em; text-transform:uppercase; font-weight:600;
  color:var(--dim); cursor:pointer; background:var(--page);
}
.tabs{display:flex; gap:2px; overflow-x:auto; margin-top:8px; scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto; padding:8px 13px 10px; font-size:14px; font-weight:600;
  color:var(--faint); border-bottom:2px solid transparent; cursor:pointer; white-space:nowrap;
}
.tab.on{color:var(--text); border-bottom-color:var(--gold)}
.tab i{font-style:normal; font-size:12px; color:var(--faint); margin-left:7px}
.tab.on i{color:var(--gold-ink)}
.tab.clear i{color:var(--green)}

.bar{height:3px; background:var(--line-2); margin-top:-1px}
.bar i{display:block; height:100%; background:var(--gold); width:0; transition:width .45s ease}

/* ---------------- layout ---------------- */
main{padding:0 18px; max-width:1700px; margin:0 auto}
.count{font-size:11px; color:var(--faint); letter-spacing:.08em; text-transform:uppercase; padding:10px 0 2px}
.count b{color:var(--text); font-weight:600}
h2{
  font-size:10px; letter-spacing:.18em; text-transform:uppercase; color:var(--gold-ink);
  font-weight:700; margin:14px 0 7px; display:flex; align-items:center; gap:10px;
}
h2:after{content:''; flex:1; height:1px; background:var(--line)}
/* Fit a whole board on an iPad without scrolling: more columns, shorter
   cards. The how-to detail moves to the sign-off sheet, where the person
   who actually needs it is already looking. */
.grid{display:grid; gap:6px; grid-template-columns:1fr}
@media(min-width:620px){ .grid{grid-template-columns:repeat(2,1fr)} }
@media(min-width:840px){ .grid{grid-template-columns:repeat(3,1fr)} }
@media(min-width:1100px){.grid{grid-template-columns:repeat(4,1fr)} }
@media(min-width:1450px){.grid{grid-template-columns:repeat(5,1fr)} }

/* ---------------- task ---------------- */
.task{
  display:flex; gap:11px; align-items:center; width:100%; text-align:left;
  background:var(--card); border-radius:10px; padding:11px 13px; cursor:pointer;
  min-height:56px; border:1px solid var(--line); box-shadow:0 1px 2px rgba(35,32,27,.04);
  transition:background .12s;
}
.task:active{background:var(--card-2)}
.box{
  flex:0 0 auto; width:24px; height:24px; border-radius:7px;
  border:2px solid #D9CFB8; background:var(--page);
  display:flex; align-items:center; justify-content:center; font-size:14px; font-weight:700;
}
.t{font-size:14px; font-weight:600; line-height:1.28}
.d{font-size:12.5px; color:var(--dim); margin-top:5px; line-height:1.45}
.sub{font-size:10.5px; color:var(--faint); margin-top:3px; letter-spacing:.03em}
.sub b{color:var(--gold-ink); font-weight:600}
.task.done{background:var(--green-soft); border-color:var(--green-line)}
.task.done .box{background:var(--green); border-color:var(--green); color:#fff}
.task.done .t{color:var(--green); font-weight:500}
.task.na{opacity:.5}
.task.na .box{background:var(--faint); border-color:var(--faint); color:#fff}
.task.late{border-color:var(--red-line); background:var(--red-soft)}
.task.late .sub b{color:var(--red)}

/* ---------------- hourly ---------------- */
.now{
  background:var(--gold-soft); border:1px solid #E6D3A6; border-radius:14px;
  padding:12px 14px; margin-top:2px; width:100%; text-align:left; cursor:pointer; display:block;
  box-shadow:0 1px 2px rgba(35,32,27,.04);
}
.now.late{background:var(--red-soft); border-color:var(--red-line)}
.now.done{background:var(--green-soft); border-color:var(--green-line)}
.now .hd{display:flex; align-items:baseline; gap:12px; flex-wrap:wrap}
.now .ttl{font-size:15px; font-weight:600; flex:1; min-width:140px}
.clock{font-size:13px; font-weight:700; letter-spacing:.05em; color:var(--gold-ink); white-space:nowrap}
.now.late .clock{color:var(--red)}
.now.done .clock{color:var(--green)}
.hours{display:flex; gap:3px; margin-top:9px; flex-wrap:wrap}
.hr{
  flex:1 1 0; min-width:24px; height:24px; border-radius:5px; display:flex;
  align-items:center; justify-content:center; font-size:10px; font-weight:700;
  background:#EFE9DB; color:var(--faint);
}
.hr.ok{background:#CFE9D3; color:var(--green)}
.hr.miss{background:#F3D3CF; color:var(--red)}
.hr.now{outline:2px solid var(--gold); color:var(--gold-ink)}
.hr.future{opacity:.45}

.empty{color:var(--faint); font-size:14px; padding:34px 4px; text-align:center; font-style:italic}
details{margin-top:16px; border-top:1px solid var(--line); padding-top:10px}
summary{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--faint); cursor:pointer; font-weight:600; list-style:none}
summary::-webkit-details-marker{display:none}
.lrow{display:flex; justify-content:space-between; gap:14px; padding:8px 2px; border-bottom:1px solid var(--line-2); font-size:13.5px; color:var(--dim)}
.lrow span:last-child{color:var(--faint); font-size:11.5px; white-space:nowrap}

/* ---------------- sheet ---------------- */
.scrim{position:fixed; inset:0; background:rgba(35,32,27,.42); z-index:60; opacity:0; pointer-events:none; transition:opacity .2s}
.scrim.on{opacity:1; pointer-events:auto}
.sheet{
  position:fixed; left:0; right:0; bottom:0; z-index:61; background:var(--card);
  border-top:1px solid var(--line); border-radius:20px 20px 0 0; padding:24px 22px;
  padding-bottom:calc(24px + env(safe-area-inset-bottom)); transform:translateY(101%);
  max-height:88vh; overflow-y:auto; box-shadow:0 -8px 40px rgba(35,32,27,.14);
  /* translateY(101%) only clears its own height — on wide screens the sheet
     also sits `bottom:28px` up, so a sliver stayed on screen. Hide it. */
  visibility:hidden;
  transition:transform .24s cubic-bezier(.3,.9,.3,1), visibility 0s linear .24s;
}
.sheet.on{
  transform:translateY(0); visibility:visible;
  transition:transform .24s cubic-bezier(.3,.9,.3,1), visibility 0s linear 0s;
}
@media(min-width:780px){.sheet{max-width:560px; margin:0 auto; border-radius:18px; bottom:28px; left:28px; right:28px; border:1px solid var(--line)}}
.sheet h3{font-size:18px; font-weight:600; line-height:1.35}
.sheet .note{color:var(--dim); font-size:13px; margin-top:8px; line-height:1.5}
.lbl{font-size:10.5px; letter-spacing:.16em; text-transform:uppercase; color:var(--gold-ink); font-weight:700; margin:22px 0 10px}
.chips{display:flex; flex-wrap:wrap; gap:8px}
.chip{background:var(--page); border:1px solid var(--line); border-radius:9px; padding:12px 15px; font-size:15px; font-weight:600; cursor:pointer}
.chip.on{background:var(--gold); color:#231F16; border-color:var(--gold)}
input[type=text]{
  width:100%; background:var(--page); border:1px solid var(--line); color:var(--text);
  border-radius:9px; padding:14px; font-size:16px; font-family:inherit;
}
input[type=text]:focus{outline:none; border-color:var(--gold)}
#initials{text-transform:uppercase; letter-spacing:.25em; font-weight:700; font-size:21px; text-align:center}
.acts{display:flex; gap:9px; margin-top:24px}
.btn{flex:1; border-radius:11px; padding:17px; font-size:14px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; cursor:pointer}
.btn.go{background:var(--gold); color:#231F16}
.btn.go:disabled{opacity:.45}
.btn.q{border:1px solid var(--line); color:var(--dim); background:var(--page); flex:0 0 auto; padding:17px 22px}
.btn.red{background:var(--red); color:#fff}
.toast{
  position:fixed; left:50%; bottom:28px; z-index:80; transform:translateX(-50%) translateY(140%);
  background:var(--text); color:#FBF8F1; padding:14px 24px; border-radius:999px;
  font-weight:700; font-size:14px; box-shadow:0 10px 34px rgba(35,32,27,.3);
  visibility:hidden; transition:transform .26s, visibility 0s linear .26s;
}
.toast.on{
  transform:translateX(-50%) translateY(0); visibility:visible;
  transition:transform .26s, visibility 0s linear 0s;
}
</style>
</head>
<body>

<header>
  <div class="top">
    <span class="mark">The Quarry</span>
    <span class="day" id="day"></span>
    <span class="sp"></span>
    <button class="ghost" id="refresh">Refresh</button>
  </div>
  <div class="tabs" id="tabs"></div>
</header>
<div class="bar"><i id="fill"></i></div>

<main id="main"></main>

<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet"></div>
<div class="toast" id="toast"></div>

<script>
/* ==================================================================
   THE QUARRY — SHIFT CHECKLIST
   Lock an iPad to a station with ?role=bartender|server|support|kitchen
   ================================================================== */
const SB  = 'https://nkulhtalltbieicvmmad.supabase.co';
const KEY = 'sb_publishable_FQK59Bn8P2jV8yGL0nPi7w_jVHFMBSl';
const H   = { apikey: KEY, Authorization: 'Bearer ' + KEY, 'Content-Type': 'application/json' };

const ROLES = [
  { id:'bartender', label:'Bar' },
  { id:'server',    label:'Servers' },
  { id:'support',   label:'Host & Bus' },
  { id:'kitchen',   label:'Kitchen' },
  { id:'staff',     label:'Staff' },
  { id:'closing',   label:'Closing' }
];
const SEGS = [ ['open','Opening'], ['shift','During Shift'], ['close','Closing'] ];
const CAD  = { daily:'Daily', weekly:'Weekly', biweekly:'Every 2 weeks', monthly:'Monthly',
               interval:'3x a month', quarterly:'Every 3 months' };

let TASKS = [], STAFF = [], SET = {}, active = 'staff', sel = null;

const $   = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const bizDate = () => new Date(new Date().toLocaleString('en-US',{timeZone:'America/Chicago'})).toLocaleDateString('en-CA');
const hhmm = d => new Date(d).toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit',timeZone:'America/Chicago'});
const hourName = h => (h % 12 === 0 ? 12 : h % 12) + (h < 12 ? 'a' : 'p');

function toast(m){
  const t = $('#toast'); t.textContent = m; t.classList.add('on');
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove('on'), 2100);
}
function store(k,v){ try{ if(v!==undefined) localStorage.setItem(k,v); return localStorage.getItem(k);}catch(e){return null;} }

async function api(path, opts){
  const r = await fetch(SB + '/rest/v1/' + path, Object.assign({headers:H}, opts||{}));
  if(!r.ok) throw new Error(await r.text());
  const t = await r.text();
  return t ? JSON.parse(t) : null;
}
async function load(){
  const [tasks, staff, set] = await Promise.all([
    api('rpc/checklist_due', { method:'POST', body: JSON.stringify({ p_date:null }) }),
    api('checklist_staff?active=eq.true&select=*&order=name'),
    api('checklist_settings?select=*')
  ]);
  TASKS = tasks || []; STAFF = staff || [];
  SET = {}; (set||[]).forEach(s => SET[s.key] = s.value);
  render();
}

/* ---------------- selectors ---------------- */
const onBoard = t => t.due_today || t.status === 'done' || t.status === 'na' || t.status === 'overdue';
const listFor = r => TASKS.filter(t => t.role === r && onBoard(t));
const isDone  = t => t.status === 'done' || t.status === 'na';

/* ---------------- render ---------------- */
function render(){
  $('#day').textContent = new Date().toLocaleDateString('en-US',
    { weekday:'long', month:'long', day:'numeric', timeZone:'America/Chicago' });

  $('#tabs').innerHTML = ROLES.map(r => {
    const l = listFor(r.id), done = l.filter(isDone).length;
    const clear = l.length && done === l.length;
    return `<button class="tab${r.id===active?' on':''}${clear?' clear':''}" data-role="${r.id}">${esc(r.label)}<i>${done}/${l.length}</i></button>`;
  }).join('');

  const list = listFor(active), done = list.filter(isDone).length;
  $('#fill').style.width = (list.length ? done/list.length*100 : 0) + '%';

  let h = `<div class="count">${list.length && done===list.length
      ? '<b>Board is clear</b>'
      : `<b>${done}</b> of <b>${list.length}</b> done`}</div>`;

  const hourly = list.filter(t => t.recurrence === 'hourly');
  if (hourly.length) h += `<h2>Right now</h2>` + hourly.map(hourlyCard).join('');

  SEGS.forEach(([id,label]) => {
    const items = list.filter(t => t.segment===id && t.recurrence!=='hourly');
    if (!items.length) return;
    h += `<h2>${label}</h2><div class="grid">${items.map(card).join('')}</div>`;
  });

  if (!hourly.length && !list.length) h += `<div class="empty">Nothing on this board today.</div>`;

  const later = TASKS.filter(t => t.role===active && !onBoard(t))
                     .sort((a,b)=>a.days_until_due-b.days_until_due);
  if (later.length) h += `<details><summary>Not due today — ${later.length}</summary>` +
    later.map(t => `<div class="lrow"><span>${esc(t.title)}</span><span>${
      t.days_until_due>=999 ? 'unscheduled' :
      t.days_until_due<=0 ? 'next open day' :
      'in ' + t.days_until_due + ' day' + (t.days_until_due===1?'':'s')}</span></div>`).join('') + `</details>`;

  $('#main').innerHTML = h;
}

function card(t){
  const done = t.status==='done', na = t.status==='na', late = t.status==='overdue';
  // Only surface what changes a decision. Everything else — how-to, area,
  // cadence — is one tap away in the sheet and doesn't earn screen height.
  let sub = '';
  if (late)               sub = `<b>Missed ${t.missed_days} shift${t.missed_days===1?'':'s'}</b>`;
  else if (done || na)    sub = `<b>${na?'N/A ':''}${esc(t.done_by||'')}</b> · ${hhmm(t.done_at)}`;
  else {
    const bits = [];
    if (t.week_of_month && t.week_of_month.length && t.week_of_month.length < 4)
      bits.push('wk ' + t.week_of_month.join('&'));
    if (t.est_minutes >= 45) bits.push('~' + t.est_minutes + 'm');
    sub = bits.join(' · ');
  }
  return `<button class="task${done?' done':''}${na?' na':''}${late?' late':''}" data-id="${t.task_id}">
    <span class="box">${done?'✓':(na?'–':'')}</span>
    <span style="flex:1;min-width:0">
      <span class="t" style="display:block">${esc(t.title)}</span>
      ${sub ? `<span class="sub" style="display:block">${sub}</span>` : ''}
    </span></button>`;
}

/* An hourly task: the hour you're standing in, plus the day's coverage. */
function hourlyCard(t){
  const done = t.status==='done', late = t.status==='overdue';
  let clock;
  if (t.minutes_left == null)  clock = 'Closed for the day';
  else if (done)               clock = `Done ${esc(t.done_by||'')} · resets in ${t.minutes_left} min`;
  else                         clock = `${t.minutes_left} min left this hour`;

  let strip = '';
  for (let hr = t.hour_start; hr <= t.hour_end; hr++){
    const past = t.current_slot != null && hr < t.current_slot;
    const isNow = hr === t.current_slot;
    const covered = t.hoursDone && t.hoursDone.indexOf(hr) > -1;
    let cls = 'hr';
    if (covered) cls += ' ok';
    else if (past) cls += ' miss';
    else if (!isNow) cls += ' future';
    if (isNow) cls += ' now';
    strip += `<span class="${cls}">${hourName(hr)}</span>`;
  }
  return `<button class="now${done?' done':''}${late?' late':''}" data-id="${t.task_id}">
    <span class="hd"><span class="ttl">${esc(t.title)}</span><span class="clock">${clock}</span></span>
    ${t.detail ? `<span class="d" style="display:block">${esc(t.detail)}</span>` : ''}
    <span class="hours" style="display:flex">${strip}</span>
    <span class="sub" style="display:block;margin-top:10px">${t.hours_covered} of ${t.hours_expected} hours covered today</span>
  </button>`;
}

/* Which hours already have a sign-off — needed to paint the strip. */
async function loadHours(){
  const hourly = TASKS.filter(t => t.recurrence === 'hourly');
  if (!hourly.length) return;
  const ids = hourly.map(t => t.task_id).join(',');
  const rows = await api(`checklist_logs?select=task_id,slot&business_date=eq.${bizDate()}&slot=not.is.null&task_id=in.(${ids})`);
  hourly.forEach(t => t.hoursDone = (rows||[]).filter(r => r.task_id===t.task_id).map(r => r.slot));
}

/* ---------------- sign-off ---------------- */
function open(id){
  sel = TASKS.find(t => t.task_id === id); if (!sel) return;
  const mine = store('quarry_initials') || '';
  const hourly = sel.recurrence === 'hourly';
  const signed = hourly ? sel.status==='done' : (sel.status==='done' || sel.status==='na');

  let h = `<h3>${esc(sel.title)}</h3>`;
  if (hourly) h += `<div class="note">This hour only — it clears at the top of the next hour.</div>`;
  if (sel.detail) h += `<div class="note">${esc(sel.detail)}</div>`;

  if (signed){
    h += `<div class="lbl">Already signed</div>
      <div class="note">${sel.status==='na'?'Marked N/A':'Done'} by <b>${esc(sel.done_by)}</b> at ${hhmm(sel.done_at)}</div>
      <div class="acts"><button class="btn red" id="undo">Undo</button><button class="btn q" id="close">Close</button></div>`;
  } else {
    if (sel.minutes_left == null && hourly){
      h += `<div class="lbl">Outside hours</div>
        <div class="note">Rounds run ${hourName(sel.hour_start)} to ${hourName(sel.hour_end)}.</div>
        <div class="acts"><button class="btn q" id="close" style="flex:1">Close</button></div>`;
    } else {
      if (STAFF.length) h += `<div class="lbl">Who did it</div><div class="chips">` +
        STAFF.map(s => `<button class="chip${s.initials===mine?' on':''}" data-i="${esc(s.initials)}">${esc(s.initials)}</button>`).join('') + `</div>`;
      h += `<div class="lbl">Initials</div>
        <input type="text" id="initials" maxlength="4" autocomplete="off" autocapitalize="characters" value="${esc(mine)}" placeholder="AB">
        <div class="lbl">Note — optional</div>
        <input type="text" id="note" maxlength="200" placeholder="Anything the next shift should know">
        <div class="acts">
          <button class="btn go" id="done">Sign Off</button>
          ${hourly ? '' : '<button class="btn q" id="na">N/A</button>'}
        </div>
        <div class="acts" style="margin-top:8px"><button class="btn q" id="close" style="flex:1">Cancel</button></div>`;
    }
  }
  $('#sheet').innerHTML = h;
  $('#scrim').classList.add('on'); $('#sheet').classList.add('on');
  const i = $('#initials'); if (i && !mine) setTimeout(()=>i.focus(), 280);
}
function close(){ $('#scrim').classList.remove('on'); $('#sheet').classList.remove('on'); sel = null; }

async function sign(status){
  const ini = ($('#initials').value||'').trim().toUpperCase();
  if (!ini) return toast('Enter your initials');
  const match = STAFF.find(s => s.initials.toUpperCase() === ini);
  $('#done').disabled = true;
  const body = {
    task_id: sel.task_id, status, initials: ini,
    staff_name: match ? match.name : null,
    note: ($('#note') && $('#note').value.trim()) || null,
    business_date: bizDate()
  };
  if (sel.recurrence === 'hourly') body.slot = sel.current_slot;
  try{
    await api('checklist_logs', { method:'POST',
      headers: Object.assign({}, H, { Prefer:'resolution=merge-duplicates' }),
      body: JSON.stringify(body) });
    store('quarry_initials', ini);
    close(); toast(status==='na' ? 'Marked N/A' : 'Signed — ' + ini);
    await refresh();
  }catch(e){ toast('Could not save — check wifi'); $('#done').disabled = false; }
}
async function undo(){
  const slot = sel.recurrence === 'hourly' ? `&slot=eq.${sel.current_slot}` : '&slot=is.null';
  try{
    await api(`checklist_logs?task_id=eq.${sel.task_id}&business_date=eq.${bizDate()}${slot}`, { method:'DELETE' });
    close(); toast('Sign-off removed'); await refresh();
  }catch(e){ toast('Could not undo'); }
}

async function refresh(){ await load(); await loadHours(); render(); }

/* ---------------- events ---------------- */
document.addEventListener('click', async e => {
  const tab = e.target.closest('.tab');
  if (tab){ active = tab.dataset.role; store('quarry_board', active); render(); return; }
  const task = e.target.closest('.task, .now');
  if (task){ open(task.dataset.id); return; }
  const chip = e.target.closest('.chip');
  if (chip){ document.querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
             chip.classList.add('on'); $('#initials').value = chip.dataset.i; return; }
  if (e.target.id === 'done')    return sign('done');
  if (e.target.id === 'na')      return sign('na');
  if (e.target.id === 'undo')    return undo();
  if (e.target.id === 'close')   return close();
  if (e.target.id === 'refresh') return refresh();
});
$('#scrim').addEventListener('click', close);

/* ---------------- boot ---------------- */
const forced = new URLSearchParams(location.search).get('role');
active = (forced && ROLES.some(r=>r.id===forced)) ? forced : (store('quarry_board') || 'staff');
refresh().catch(()=>{ $('#main').innerHTML = '<div class="empty">Could not load — check the connection.</div>'; });
setInterval(()=>{ if(!sel) refresh().catch(()=>{}); }, 60000);
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && !sel) refresh().catch(()=>{}); });
</script>
</body>
